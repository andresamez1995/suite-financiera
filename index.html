<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Suite Financiera</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #0f172a; }
    nav { display: flex; background: #1e293b; padding: 12px; gap: 10px; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex-wrap: wrap; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    /* Estilo especial para el botón de instalar */
    #btn-instalar { background: #10b981; display: none; }
    #btn-instalar:hover { background: #059669; }
    iframe { flex: 1; border: none; width: 100%; height: 100%; background: white; }
  </style>
</head>
<body>
  <nav>
<nav>
    <button onclick="cambiarApp('/suite-financiera/calculadora/index.html')">Calculadora Salarial</button>
    <button onclick="cambiarApp('/suite-financiera/gastos/index.html')">Gestión de Gastos</button>
    <!-- Botón automático de instalación -->
    <button id="btn-instalar">📲 Instalar App</button>
  </nav>

  <iframe id="app-frame" src="/suite-financiera/calculadora/index.html"></iframe>

  <script>
    function cambiarApp(ruta) {
      document.getElementById('app-frame').src = ruta;
    }

    // Código para activar el botón de instalación automática
    let deferredPrompt;
    const btnInstalar = document.getElementById('btn-instalar');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstalar.style.display = 'block'; // Muestra el botón solo si se puede instalar
    });

    btnInstalar.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('Usuario aceptó instalar la app');
        }
        deferredPrompt = null;
        btnInstalar.style.display = 'none';
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
