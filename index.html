<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Suite Financiera</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Suite">
<link rel="stylesheet" href="suite-tema.css">
<script src="suite-tema.js"></script>
<script src="suite-iconos.js"></script>
<script src="suite-ui.js"></script>

<style>
:root{ --font:var(--font-body); }
*{box-sizing:border-box;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font);}
/* La página ocupa SIEMPRE lo que se ve en pantalla (position:fixed), sin usar vh/dvh: esas unidades quedan desfasadas en Android
   cuando la barra del navegador aparece o se esconde (p. ej. tras recargar) y empujaban la barra inferior fuera de la pantalla. */
html,body{overscroll-behavior:none;}
body{position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden;}
button{font-family:inherit; cursor:pointer;}

#bar{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px; background:var(--surface); border-bottom:1px solid var(--border);}
#seg{flex:1; display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:3px; max-width:420px;}
#seg button{flex:1; border:none; background:none; color:var(--text-dim); font-size:13.5px; font-weight:600; padding:8px 6px; border-radius:9px; min-height:38px; display:flex; align-items:center; justify-content:center; gap:6px; transition:background .15s,color .15s;}
#seg button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); box-shadow:0 1px 4px rgba(0,0,0,.15);}
.rbtn{flex:0 0 auto; width:44px; height:44px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:20px; line-height:1; position:relative;}
.rbtn:hover{background:var(--surface-2);}
#seg .ico{display:inline-flex;} #seg .ico svg{width:18px;height:18px;} .rbtn svg{width:22px;height:22px;display:block;margin:auto;} .spacer{display:none;}
@media (max-width:899.98px){ #bar{display:none;} }   /* en celular cada app trae su selector y su ⋯ */
@media (min-width:900px){
  #seg .ico svg{width:24px;height:24px;}
  body{flex-direction:row;}
  #bar{flex-direction:column; width:104px; align-items:stretch; gap:10px; padding:calc(14px + env(safe-area-inset-top,0px)) 10px 14px; border-bottom:0; border-right:1px solid var(--border);}
  #seg{flex:0 0 auto; flex-direction:column; gap:6px; background:none; padding:0;}
  #seg button{flex-direction:column; gap:4px; min-height:64px; font-size:11px; padding:10px 2px;}
  #seg .ico{font-size:22px;}
  .spacer{display:block; flex:1;}
  .rbtn{width:100%;}
  #frames{height:100%;}
}
#menuBtn .dot{position:absolute; top:7px; right:7px; width:9px; height:9px; border-radius:50%; background:var(--danger); display:none;}
#menuBtn.has-update .dot{display:block;}
#menuBtn.has-sync .dot{display:block; background:var(--necesito);}

#frames{flex:1; position:relative; padding-bottom:env(safe-area-inset-bottom,0px); min-height:0;}
.frame{position:absolute; inset:0 0 env(safe-area-inset-bottom,0px) 0; width:100%; height:calc(100% - env(safe-area-inset-bottom,0px)); border:0; background:var(--bg); visibility:hidden; pointer-events:none;}
.frame.on{visibility:visible; pointer-events:auto;}

#overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:50; align-items:flex-end; justify-content:center;}
#overlay.show{display:flex;}
#sheet{width:100%; max-width:520px; background:var(--surface); border-radius:20px 20px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:85vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.25);}
#sheet::before{content:''; display:block; width:40px; height:4px; border-radius:2px; background:var(--border); margin:-4px auto 12px;}
#overlay.show #sheet{animation:subir .22s ease-out;}
@keyframes subir{from{transform:translateY(24px); opacity:0;} to{transform:none; opacity:1;}}
#sheet h2{margin:0 0 4px; font-family:var(--font-display); font-size:18px;}
#sheet .sub{font-size:12.5px; color:var(--text-dim); margin-bottom:12px;}
.item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:12px 14px; border-radius:12px; margin-bottom:8px; font-size:14px; min-height:48px;}
.item .ic{width:24px; height:24px; display:flex; align-items:center; justify-content:center;} .item .ic svg{width:22px;height:22px;}
.item small{display:block; color:var(--text-dim); font-size:11.5px; margin-top:1px;}
.item.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);} .item.primary small{color:inherit; opacity:.85;}
.status{font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:8px; margin:12px 2px 4px;}
.pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:700; background:var(--surface-2); border:1px solid var(--border);}
.pill.ok{color:var(--accent); border-color:var(--accent);} .pill.warn{color:var(--danger); border-color:var(--danger);}
.close{float:right; background:none; border:none; color:var(--text-dim); font-size:20px; width:40px; height:40px;}

#tour{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px;}
#tour[hidden]{display:none;}
.tour-box{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px 20px 18px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); animation:subir .25s ease-out;}
.tour-art{height:120px; display:flex; align-items:center; justify-content:center; gap:14px; color:var(--accent); margin-bottom:6px;}
.tour-art .bub{width:76px; height:76px; border-radius:22px; background:color-mix(in srgb,var(--accent) 14%,var(--surface-2)); border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border)); display:flex; align-items:center; justify-content:center;}
.tour-art svg{width:38px; height:38px; stroke-width:1.6;}
.tour-box h2{font-family:var(--font-display); font-size:20px; margin:6px 0 6px;}
.tour-box p{font-size:14px; line-height:1.5; color:var(--text-dim); margin:0 auto 14px; max-width:32ch;}
.tour-dots{display:flex; gap:6px; justify-content:center; margin-bottom:16px;}
.tour-dots i{width:7px; height:7px; border-radius:50%; background:var(--border);} .tour-dots i.on{background:var(--accent); width:20px; border-radius:4px;}
.tour-actions{display:flex; gap:10px;}
.tour-actions button{flex:1; min-height:46px; border-radius:12px; font-size:14.5px; font-weight:700;}
.tour-ghost{background:none; border:1px solid var(--border); color:var(--text-dim);}
.tour-next{background:var(--accent); color:var(--accent-ink); border:none;}
#syncOverlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:75; display:flex; align-items:flex-end; justify-content:center;}
#syncOverlay[hidden]{display:none;}
#syncSheet{width:100%; max-width:520px; background:var(--surface); border-radius:20px 20px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:90vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.25); animation:subir .22s ease-out;}
#syncSheet h2{margin:0 0 4px; font-family:var(--font-display); font-size:18px;}
#syncSheet .sub{font-size:12.5px; color:var(--text-dim); margin-bottom:10px;}
.sy-box{background:var(--surface-2); border-radius:12px; padding:12px; font-size:12.5px; line-height:1.55; color:var(--text-dim); margin:10px 0;}
.sy-box b{color:var(--text);} .sy-box ul{margin:6px 0 0; padding-left:18px;} .sy-box li{margin:3px 0;}
.sy-estado{display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; border:1px solid var(--border); margin:10px 0; font-size:13.5px;}
.sy-estado .pt{width:10px; height:10px; border-radius:50%; background:var(--accent); flex:0 0 auto;} .sy-estado.pend .pt{background:var(--necesito);} .sy-estado.mal .pt{background:var(--danger);}
.sy-btn{display:block; width:100%; min-height:46px; border-radius:12px; border:none; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:8px; background:var(--accent); color:var(--accent-ink);}
.sy-btn.sec{background:var(--surface-2); color:var(--text); border:1px solid var(--border);} .sy-btn.peligro{background:none; color:var(--danger); border:1px solid var(--border);} .sy-btn:disabled{opacity:.45; cursor:default;}
.sy-check{display:flex; gap:10px; align-items:flex-start; font-size:13px; margin:12px 0 4px; cursor:pointer;} .sy-check input{margin-top:3px; width:20px; height:20px; flex:0 0 auto;}
.sy-input{width:100%; min-height:46px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:0 12px; font-size:14px; margin-top:6px;}
.sy-copia{display:flex; align-items:center; gap:8px; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;} .sy-copia button{min-height:36px; padding:0 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer; font-weight:600;}
#toast{position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:60; display:none; justify-content:center; pointer-events:none;}
#toast.show{display:flex;}
#toast .box{pointer-events:auto; background:var(--text); color:var(--bg); padding:11px 14px; border-radius:12px; display:flex; gap:14px; align-items:center; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:480px;}
#toast button{background:none; border:none; color:var(--accent); font-weight:700; font-size:13.5px; padding:4px 6px; min-height:32px;}
</style>
</head>
<body>

<div id="bar">
  <div id="seg" role="tablist" aria-label="Aplicación">
    <button type="button" role="tab" id="tab-calculadora" data-app="calculadora" aria-selected="true"><span class="ico" data-ic="calc"></span><span class="lbl">Calculadora</span></button>
    <button type="button" role="tab" id="tab-gastos" data-app="gastos" aria-selected="false"><span class="ico" data-ic="wallet"></span><span class="lbl">Gastos</span></button>
  </div>
  <div class="spacer"></div>
  <button type="button" id="themeBtn" class="rbtn" aria-label="Cambiar tema"></button>
  <button type="button" id="menuBtn" class="rbtn" aria-label="Menú" aria-haspopup="dialog"><span data-ic="dots"></span><span class="dot"></span></button>
</div>

<div id="frames">
  <iframe class="frame" id="frame-calculadora" title="Calculadora salarial" data-src="calculadora/index.html"></iframe>
  <iframe class="frame" id="frame-gastos" title="Gestor de gastos" data-src="gastos/index.html"></iframe>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-label="Menú">
  <div id="sheet">
    <button type="button" class="close" id="closeMenu" aria-label="Cerrar"><span data-ic="x"></span></button>
    <h2>Mi Suite Financiera</h2>
    <div class="sub">Tus datos viven solo en este dispositivo.</div>
    <div id="menuItems"></div>
    <div class="status"><span id="netPill" class="pill">…</span><span id="offlinePill" class="pill">…</span></div>
    <div class="status" id="verLine"></div>
  </div>
</div>
<div id="syncOverlay" role="dialog" aria-modal="true" aria-label="Sincronización con Google Drive" hidden><div id="syncSheet"></div></div>
<div id="toast"><div class="box"><span id="toastMsg"></span><button type="button" id="toastBtn"></button></div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="tour" role="dialog" aria-modal="true" aria-labelledby="tourTitulo" hidden>
  <div class="tour-box">
    <div class="tour-art" id="tourArt" aria-hidden="true"></div>
    <h2 id="tourTitulo"></h2>
    <p id="tourTexto"></p>
    <div class="tour-dots" id="tourDots" aria-hidden="true"></div>
    <div class="tour-actions"><button type="button" id="tourSaltar" class="tour-ghost">Saltar</button><button type="button" id="tourSig" class="tour-next">Siguiente</button></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const APPS = ['calculadora','gastos'];
const LAST_KEY = 'suite_ultima_app';
const STORAGE_PATTERN = /^(finanzas_app_v12|co(\d{4})?_[\w]+)$/;   // claves de ambos programas
const SKIP = /_corrupto(_fecha)?$/;
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.querySelectorAll('[data-ic]').forEach(el=>{ el.innerHTML = ic(el.dataset.ic, 22); });
/* ---------- Tema global (un solo botón para las dos apps) ---------- */
function iconoTema(){
  const t = SuiteTema.get(), b = $('themeBtn');
  b.innerHTML = ic(t==='dark' ? 'moon' : t==='light' ? 'sun' : 'auto', 22);
  const txt = 'Tema: ' + (t==='dark' ? 'oscuro' : t==='light' ? 'claro' : 'automático (según tu dispositivo)') + ' — toca para cambiar';
  b.title = txt; b.setAttribute('aria-label', txt);
}
$('themeBtn').addEventListener('click', ()=>{ SuiteTema.cycle(); iconoTema(); toast('Tema ' + ({dark:'oscuro', light:'claro'}[SuiteTema.get()] || 'automático') + ' en las dos apps', null, null, 2200); });
window.addEventListener('suite-tema', iconoTema);
iconoTema();

/* ---------- Selector de app: los dos iframes se quedan vivos (no pierdes mes, scroll ni filtros) ---------- */
let actual = null;
const mqRail = window.matchMedia ? matchMedia('(min-width:900px)') : {matches:true, addEventListener(){}};
function cargar(app){ const f = $('frame-'+app); if(!f.getAttribute('src')) f.setAttribute('src', f.dataset.src + (mqRail.matches ? '?rail=1' : '')); }
function enviarLayout(){ APPS.forEach(a=>{ const f = $('frame-'+a); try{ if(f.contentWindow) f.contentWindow.postMessage({suite:'layout', rail:mqRail.matches}, location.origin); }catch(e){} }); }
if(mqRail.addEventListener) mqRail.addEventListener('change', enviarLayout);
APPS.forEach(a=>{ $('frame-'+a).addEventListener('load', enviarLayout); });
// Sacude el diseño de la app visible (evita que la barra inferior quede mal pintada tras cambiar de app, girar o volver a la pestaña)
function refrescarVista(){
  const f = $('frame-'+actual); if(!f) return;
  requestAnimationFrame(()=>{ try{ f.contentWindow.dispatchEvent(new Event('resize')); }catch(e){} });
}
document.addEventListener('pointerdown', ()=>SuiteSync.gesto(), true);
window.addEventListener('pageshow', refrescarVista);
window.addEventListener('orientationchange', ()=>setTimeout(refrescarVista, 250));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refrescarVista(); });
function mostrar(app, {recordar=true}={}){
  if(!APPS.includes(app)) app = 'calculadora';
  cargar(app); actual = app;
  APPS.forEach(a=>{
    $('frame-'+a).classList.toggle('on', a===app);
    const t = $('tab-'+a); t.setAttribute('aria-selected', a===app ? 'true' : 'false');
  });
  if(recordar){ try{ localStorage.setItem(LAST_KEY, app); }catch(e){} }
  refrescarVista();
}
document.querySelectorAll('#seg button').forEach(b=> b.addEventListener('click', ()=> mostrar(b.dataset.app)));
(function inicio(){
  let app = new URLSearchParams(location.search).get('app');
  if(!APPS.includes(app)){ try{ app = localStorage.getItem(LAST_KEY); }catch(e){} }
  mostrar(APPS.includes(app) ? app : 'calculadora', {recordar:false});
  const otro = APPS.find(a=>a!==actual);
  const precargar = ()=> cargar(otro);                       // la otra app queda lista (y guardada para uso sin conexión)
  if('requestIdleCallback' in window) requestIdleCallback(precargar, {timeout:3000}); else setTimeout(precargar, 1500);
})();

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, label, fn, ms){
  $('toastMsg').textContent = msg;
  const b = $('toastBtn'); b.style.display = label ? '' : 'none'; b.textContent = label||''; b.onclick = ()=>{ $('toast').classList.remove('show'); if(fn) fn(); };
  $('toast').classList.add('show'); clearTimeout(toastTimer);
  if(ms!==0) toastTimer = setTimeout(()=>$('toast').classList.remove('show'), ms||6000);
}

/* ---------- Instalación (Android/escritorio) y guía para iPhone/iPad ---------- */
let promptInstalar = null;
const esStandalone = ()=> { try{ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }catch(e){ return false; } };
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const esSafariIOS = esIOS && /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios|opios/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); promptInstalar = e; });
window.addEventListener('appinstalled', ()=>{ promptInstalar = null; toast('Mi Suite quedó instalada ✓'); });
function guiaIOS(){
  alert(esSafariIOS
    ? 'Para instalar en tu iPhone/iPad:\n\n1. Toca el botón Compartir (el cuadrado con la flecha hacia arriba) en la barra de Safari.\n2. Elige “Añadir a pantalla de inicio”.\n3. Toca “Añadir”.'
    : 'En iPhone/iPad la instalación solo funciona desde Safari.\n\nAbre esta misma dirección en Safari, toca Compartir y elige “Añadir a pantalla de inicio”.');
}

/* ---------- Actualizaciones y modo sin conexión ---------- */
let swReg = null, swEsperando = null;
function avisarActualizacion(sw){
  swEsperando = sw; $('menuBtn').classList.add('has-update');
  toast('Hay una versión nueva disponible', 'Actualizar', aplicarActualizacion, 0);
}
function aplicarActualizacion(){
  if(swEsperando) swEsperando.postMessage({type:'SKIP_WAITING'}); else location.reload();
}
function buscarActualizacion(){
  if(!swReg){ toast('El modo sin conexión no está disponible en este navegador'); return; }
  toast('Buscando actualización…', null, null, 2500);
  swReg.update().then(()=>{ setTimeout(()=>{ if(!swEsperando) toast('Ya tienes la última versión ✓'); }, 1200); }).catch(()=> toast('No se pudo buscar (¿sin internet?)'));
}
if('serviceWorker' in navigator){
  const teniaControl = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!teniaControl || recargando) return; recargando = true; location.reload(); });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      swReg = reg;
      if(reg.waiting && navigator.serviceWorker.controller) avisarActualizacion(reg.waiting);
      reg.addEventListener('updatefound', ()=>{
        const nuevo = reg.installing; if(!nuevo) return;
        nuevo.addEventListener('statechange', ()=>{ if(nuevo.state==='installed' && navigator.serviceWorker.controller) avisarActualizacion(nuevo); });
      });
      setInterval(()=>{ reg.update().catch(()=>{}); }, 30*60*1000);
      window.addEventListener('online', ()=>{ reg.update().catch(()=>{}); pintarEstado(); });
    }).catch(err=>{ console.warn('No se pudo registrar el service worker:', err); pintarEstado(); });
  });
}
window.addEventListener('offline', ()=>{ pintarEstado(); toast('Sin conexión: todo sigue funcionando con lo guardado'); });
window.addEventListener('online', pintarEstado);

/* ---------- Respaldo unificado (calculadora + gastos) ---------- */
function descargar(contenido, nombre){
  const url = URL.createObjectURL(new Blob([contenido], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function clavesSuite(){
  const out = [];
  for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(STORAGE_PATTERN.test(k) && !SKIP.test(k)) out.push(k); }
  return out;
}
function exportarTodo(){
  try{
    const storage = {}; clavesSuite().forEach(k=>{ storage[k] = localStorage.getItem(k); });
    if(!Object.keys(storage).length){ toast('Aún no hay datos para exportar'); return; }
    const hoy = new Date(), f = hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');
    descargar(JSON.stringify({suite:'mi-suite-financiera', version:1, exportadoEn:hoy.toISOString(), storage}, null, 2), `mi-suite_respaldo_${f}.json`);
    try{ localStorage.setItem('suite_ultimo_respaldo', f); }catch(e){}
    toast('Respaldo de las dos apps descargado ✓');
  }catch(e){ toast('No se pudo exportar'); }
}
function importarTodo(file){
  const r = new FileReader();
  r.onload = ev=>{
    let data; try{ data = JSON.parse(ev.target.result); }catch(e){ alert('El archivo no es un JSON válido.'); return; }
    if(!data || data.suite!=='mi-suite-financiera' || !data.storage || typeof data.storage!=='object'){ alert('Este archivo no es un respaldo de Mi Suite (use el que exporta este menú).'); return; }
    const claves = Object.keys(data.storage).filter(k=>STORAGE_PATTERN.test(k) && !SKIP.test(k) && typeof data.storage[k]==='string');
    for(const k of claves){ try{ JSON.parse(data.storage[k]); }catch(e){ if(!/_intereses_enero$/.test(k)){ alert('El respaldo tiene datos dañados ('+k+'). No se importó nada.'); return; } } }
    if(!claves.length){ alert('El respaldo no contiene datos de las apps.'); return; }
    const tieneG = claves.includes('finanzas_app_v12'), nCalc = claves.filter(k=>k!=='finanzas_app_v12').length;
    if(!confirmaYa('Se reemplazarán los datos actuales de las dos apps con los del archivo ('+(tieneG?'gastos + ':'')+nCalc+' bloques de la calculadora). ¿Continuar?')) return;
    clavesSuite().forEach(k=>localStorage.removeItem(k));
    claves.forEach(k=>localStorage.setItem(k, data.storage[k]));
    APPS.forEach(a=>{ const f = $('frame-'+a); if(f.getAttribute('src')){ try{ f.contentWindow.location.reload(); }catch(e){ f.setAttribute('src', f.dataset.src); } } });
    aplicarTema(); cerrarMenu(); toast('Datos restaurados en las dos apps ✓');
  };
  r.readAsText(file);
}
$('importFile').addEventListener('change', e=>{ const f = e.target.files[0]; e.target.value=''; if(f) importarTodo(f); });

/* ---------- Menú ---------- */
function pintarEstado(){
  const on = navigator.onLine;
  $('netPill').textContent = on ? 'En línea' : 'Sin conexión'; $('netPill').className = 'pill ' + (on ? 'ok' : 'warn');
  const p = $('offlinePill');
  if(!('serviceWorker' in navigator) || !('caches' in window)){ p.textContent = 'Sin modo offline'; p.className = 'pill warn'; return; }
  caches.match('./calculadora/index.html').then(hit=>{
    caches.match('./gastos/index.html').then(hit2=>{
      const ok = !!(hit && hit2); p.textContent = ok ? 'Lista para usar sin internet' : 'Preparando modo sin conexión…'; p.className = 'pill ' + (ok ? 'ok' : '');
    });
  }).catch(()=>{ p.textContent = 'Modo offline no disponible'; p.className = 'pill warn'; });
}
function construirMenu(){
  const it = [];
  if(swEsperando) it.push(`<button class="item primary" data-act="update"><span class="ic">${ic('refresh')}</span><span>Instalar la versión nueva<small>La app se recarga (tus datos no se tocan)</small></span></button>`);
  if(!esStandalone()){
    if(promptInstalar) it.push(`<button class="item" data-act="instalar"><span class="ic">${ic('phone')}</span><span>Instalar en este dispositivo<small>Ábrela como una app, también sin internet</small></span></button>`);
    else if(esIOS) it.push(`<button class="item" data-act="ios"><span class="ic">${ic('phone')}</span><span>Añadir a pantalla de inicio<small>Te muestro cómo hacerlo en Safari</small></span></button>`);
  }
  { const t = SuiteTema.get(); it.push(`<button class="item" data-act="tema"><span class="ic">${ic(t==='dark'?'moon':t==='light'?'sun':'auto')}</span><span>Tema: ${t==='dark'?'oscuro':t==='light'?'claro':'automático'}<small>Toca para cambiar · se aplica a las dos apps</small></span></button>`); }
  { const se = SuiteSync.estado();
    const sub = !se.configurado ? 'Configúrala una vez para usar tus datos en otros dispositivos' : !se.conectado ? 'Guarda tus datos en tu Drive y úsalos en otros dispositivos' : textoEstadoCorto(se);
    it.push(`<button class="item" data-act="sync"><span class="ic">${ic(se.conectado ? 'cloud-ok' : 'cloud')}</span><span>Sincronizar con Google Drive<small>${esc(sub)}</small></span></button>`); }
  it.push(`<button class="item" data-act="export"><span class="ic">${ic('download')}</span><span>Exportar respaldo de las dos apps<small>Un solo archivo con calculadora + gastos</small></span></button>`);
  it.push(`<button class="item" data-act="import"><span class="ic">${ic('upload')}</span><span>Importar respaldo<small>Reemplaza los datos de las dos apps</small></span></button>`);
  it.push(`<button class="item" data-act="buscar"><span class="ic">${ic('refresh')}</span><span>Buscar actualización</span></button>`);
  it.push(`<button class="item" data-act="tour"><span class="ic">${ic('help')}</span><span>Ver el recorrido de bienvenida</span></button>`);
  $('menuItems').innerHTML = it.join('');
  $('verLine').textContent = 'Los datos se guardan solo en este dispositivo: exporta un respaldo de vez en cuando.';
}
function abrirMenu(){ construirMenu(); pintarEstado(); $('overlay').classList.add('show'); try{ window.focus(); $('closeMenu').focus(); }catch(e){} }   // el foco pasa al menú para que Esc y el teclado funcionen también si se abrió desde una app
function cerrarMenu(){ $('overlay').classList.remove('show'); }
$('menuBtn').addEventListener('click', abrirMenu);
$('closeMenu').addEventListener('click', cerrarMenu);
$('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') cerrarMenu(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') cerrarMenu(); });
$('menuItems').addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='sync'){ cerrarMenu(); abrirSync(); }
  else if(a==='tema'){ SuiteTema.cycle(); iconoTema(); construirMenu(); }
  else if(a==='export'){ exportarTodo(); }
  else if(a==='import'){ $('importFile').click(); }
  else if(a==='buscar'){ cerrarMenu(); buscarActualizacion(); }
  else if(a==='tour'){ cerrarMenu(); abrirTour(0); }
  else if(a==='update'){ cerrarMenu(); aplicarActualizacion(); }
  else if(a==='ios'){ guiaIOS(); }
  else if(a==='instalar' && promptInstalar){ cerrarMenu(); promptInstalar.prompt(); promptInstalar.userChoice.finally(()=>{ promptInstalar = null; }); }
});

/* ---------- Sincronización con Google Drive ---------- */
function hace(ms){ if(!ms) return 'nunca'; const s = Math.max(0, Math.round((Date.now()-ms)/1000)); if(s<45) return 'hace unos segundos'; if(s<3600) return 'hace '+Math.round(s/60)+' min'; if(s<86400) return 'hace '+Math.round(s/3600)+' h'; return 'hace '+Math.round(s/86400)+' días'; }
function textoEstadoCorto(e){
  if(e.fase==='sincronizando' || e.fase==='conectando') return 'Sincronizando…';
  if(e.fase==='reconectar') return 'Toca para reconectar con Google';
  if(e.fase==='sin_conexion') return 'Sin conexión: se sincroniza al volver';
  if(e.fase==='error') return 'Error al sincronizar';
  if(e.pendiente || e.fase==='pendiente') return 'Cambios por sincronizar';
  return 'Conectado'+(e.email?' como '+e.email:'')+' · '+hace(e.ult);
}
const AVISO_LEGAL = `<div class="sy-box"><b>Cómo funciona y qué debes saber</b><ul>
  <li>Tus datos viven en tu dispositivo. Si activas la sincronización, la app guarda una copia en una carpeta oculta de <b>tu propio Google Drive</b>, que solo esta app puede abrir.</li>
  <li>Quien publica esta app <b>no tiene servidor, no recibe ni ve tus datos y no tiene acceso a tu Drive</b>.</li>
  <li>El único permiso que pide a Google es guardar y leer los datos de la propia app en tu Drive. No puede ver tus otros archivos.</li>
  <li>Tú eres responsable de tu cuenta de Google y de los dispositivos donde la uses. Puedes desconectar cuando quieras y borrar tu copia desde aquí.</li>
  <li>Datos personales (Ley 1581 de 2012): la información la administras tú, en tu dispositivo y en tu Drive; la app no la recolecta ni la envía a terceros distintos de Google.</li>
  <li>Es una herramienta personal de referencia: no es asesoría financiera, tributaria ni legal, y se ofrece «tal cual», sin garantías. Haz respaldos de vez en cuando.</li></ul>
  <div style="margin-top:8px;"><a href="privacidad.html" target="_blank" rel="noopener" style="color:var(--accent); font-weight:600;">Política de privacidad</a></div></div>`;
function abrirSync(){ $('syncOverlay').hidden = false; SuiteSync.precargar(); pintarSync(); const c = $('syCerrar'); if(c) c.focus(); }
function cerrarSync(){ $('syncOverlay').hidden = true; }
async function pintarSync(){
  if($('syncOverlay').hidden) return;
  const e = SuiteSync.estado(), box = $('syncSheet'), cab = `<button type="button" class="close" id="syCerrar" aria-label="Cerrar">${ic('x',22)}</button><h2>Sincronizar con Google Drive</h2>`;
  let h = cab;
  if(!e.configurado){
    h += `<div class="sub">Falta un dato de configuración (una sola vez, lo hace quien publica la app).</div>
      <div class="sy-box">Necesitas un <b>ID de cliente</b> de Google (gratis):<ul>
        <li>Entra a <b>console.cloud.google.com</b> y crea un proyecto.</li>
        <li>En «APIs y servicios → Biblioteca», activa <b>Google Drive API</b>.</li>
        <li>En «Pantalla de consentimiento OAuth»: tipo <b>Externo</b>, escribe el nombre de la app y tu correo, agrega el permiso <b>…/auth/drive.appdata</b> y publícala (<b>En producción</b>).</li>
        <li>En «Credenciales → Crear → ID de cliente de OAuth → Aplicación web», agrega en «Orígenes autorizados de JavaScript»: <b>${esc(location.origin)}</b></li>
        <li>Copia el ID de cliente y pégalo abajo.</li></ul></div>
      <input class="sy-input" id="syCid" placeholder="123456-abc.apps.googleusercontent.com" autocomplete="off" spellcheck="false">
      <button class="sy-btn" id="syGuardarCid">Guardar</button>`;
  } else if(!e.conectado){
    h += `<div class="sub">Usa tus datos en el celular y en el computador sin exportar respaldos.</div>${AVISO_LEGAL}
      <label class="sy-check"><input type="checkbox" id="syAcepto" ${e.acepto?'checked':''}><span>Entiendo y acepto cómo funciona.</span></label>
      <button class="sy-btn" id="syConectar" ${e.acepto?'':'disabled'}>Conectar con Google</button>
      <button class="sy-btn sec" id="syCambiarCid">Cambiar ID de cliente</button>`;
  } else {
    const cls = (e.fase==='error' || e.fase==='reconectar') ? 'mal' : (e.pendiente || e.fase==='sin_conexion' || e.fase==='pendiente') ? 'pend' : '';
    h += `<div class="sub">${esc(e.email ? 'Cuenta: '+e.email : 'Conectado')}</div>
      <div class="sy-estado ${cls}"><span class="pt"></span><span>${esc(textoEstadoCorto(e))}${e.msg?'<br><small style="color:var(--text-dim)">'+esc(e.msg)+'</small>':''}</span></div>
      ${e.fase==='reconectar' ? '<button class="sy-btn" id="syReconectar">Reconectar con Google</button>' : '<button class="sy-btn" id="sySync">Sincronizar ahora</button>'}
      <div class="sy-box" style="margin-top:12px;">Se sincroniza solo: al abrir la app, unos segundos después de cada cambio y cada ~30 segundos mientras la tienes abierta. Cada ~hora Google puede pedir confirmar la sesión: toca «Reconectar».</div>
      <div id="syCopias"></div>
      <button class="sy-btn sec" id="syDesconectar">Desconectar este dispositivo</button>
      <button class="sy-btn peligro" id="syBorrar">Borrar mis datos de Drive</button>
      <details class="sy-box"><summary style="cursor:pointer; font-weight:700; color:var(--text);">Aviso legal y privacidad</summary>${AVISO_LEGAL}</details>`;
  }
  box.innerHTML = h;
  if(e.conectado && e.fase!=='reconectar'){ SuiteSync.listarCopias().then(l=>{ const c = $('syCopias'); if(!c || !l.length) return; c.innerHTML = '<div class="sub" style="margin-top:12px;">Copias automáticas (últimos 7 días)</div>'+l.map(f=>`<div class="sy-copia"><span>${esc(f.name.replace('suite-respaldo-','').replace('.json',''))}</span><button data-rest="${esc(f.id)}">Restaurar</button></div>`).join(''); }).catch(()=>{}); }
}
$('syncSheet').addEventListener('click', async ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  try{
    if(b.id==='syCerrar') cerrarSync();
    else if(b.id==='syGuardarCid'){ const v = SuiteSync.limpiarId($('syCid').value); if(!v){ alert('Ese ID no parece correcto. Debe verse así: 123456789012-abcdef...apps.googleusercontent.com (sin https:// ni espacios).'); return; } SuiteSync.configurar(v); pintarSync(); }
    else if(b.id==='syCambiarCid'){ SuiteSync.configurar(''); pintarSync(); }
    else if(b.id==='syConectar'){ b.disabled = true; b.textContent = 'Conectando…'; const ok = await SuiteSync.conectar(); if(ok) toast('Conectado. Tus datos se sincronizan con tu Drive.'); pintarSync(); }
    else if(b.id==='syReconectar'){ b.disabled = true; await SuiteSync.reconectar(); pintarSync(); }
    else if(b.id==='sySync'){ b.disabled = true; await SuiteSync.sincronizarAhora(); pintarSync(); }
    else if(b.id==='syDesconectar'){ if(confirmaYa('Este dispositivo dejará de sincronizar. Tus datos locales y los de tu Drive se conservan.')){ SuiteSync.desconectar(); pintarSync(); } }
    else if(b.id==='syBorrar'){ if(confirmaYa('Se borrarán de tu Drive la copia de la app y sus respaldos, y este dispositivo se desconectará. Tus datos en este dispositivo se conservan. ¿Continuar?')){ await SuiteSync.borrarNube(); toast('Tus datos en Drive fueron borrados.'); pintarSync(); } }
    else if(b.dataset.rest){ if(confirmaYa('Se reemplazarán los datos de TODOS tus dispositivos por los de esta copia. ¿Continuar?')){ await SuiteSync.restaurarCopia(b.dataset.rest); toast('Copia restaurada.'); pintarSync(); } }
  }catch(err){ alert((err && err.message) || 'No se pudo completar la acción'); pintarSync(); }
});
$('syncSheet').addEventListener('change', ev=>{ if(ev.target.id==='syAcepto'){ SuiteSync.aceptar(ev.target.checked); const c = $('syConectar'); if(c) c.disabled = !ev.target.checked; } });
$('syncOverlay').addEventListener('click', ev=>{ if(ev.target.id==='syncOverlay') cerrarSync(); });
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && !$('syncOverlay').hidden) cerrarSync(); });
SuiteSync.onEstado(e=>{
  const mb = $('menuBtn'); const mal = e.conectado && (e.fase==='reconectar' || e.fase==='error' || (e.pendiente && e.fase!=='sincronizando'));
  mb.classList.toggle('has-sync', !!mal);
  if(!$('syncOverlay').hidden) pintarSync();
});
SuiteSync.onAplicado = ()=>{ toast('Se actualizaron tus datos desde otro dispositivo.'); };
SuiteSync.onAviso = m=>{ toast(m, null, null, 10000); };
setInterval(()=>{ if(!$('syncOverlay').hidden) pintarSync(); }, 30000);

/* ---------- Recorrido de bienvenida ---------- */
const TOUR = [
  {art:['calc','wallet'], t:'Dos herramientas, una suite', x:'La calculadora te dice cuánto te llega de verdad cada mes. El gestor te muestra a dónde se va. Se pasan datos entre ellas.'},
  {art:['shield'], t:'Tus datos son tuyos', x:'Todo se guarda solo en este dispositivo: sin cuentas ni servidores. Haz un respaldo de vez en cuando desde el menú ⋯.'},
  {art:['phone','cloud-off'], t:'Instálala y úsala sin internet', x:'Agrégala a tu pantalla de inicio y abre igual sin conexión. El tema claro u oscuro se cambia con un solo botón.'}
];
let tourIdx = 0;
function abrirTour(i){
  tourIdx = i||0; $('tour').hidden = false; pintarTour(); $('tourSig').focus();
}
function cerrarTour(){ $('tour').hidden = true; try{ localStorage.setItem('suite_tour_visto','1'); }catch(e){} }
function pintarTour(){
  const p = TOUR[tourIdx];
  $('tourArt').innerHTML = p.art.map(n=>`<span class="bub">${ic(n,38)}</span>`).join('');
  $('tourTitulo').textContent = p.t; $('tourTexto').textContent = p.x;
  $('tourDots').innerHTML = TOUR.map((_,k)=>`<i class="${k===tourIdx?'on':''}"></i>`).join('');
  $('tourSig').textContent = tourIdx===TOUR.length-1 ? 'Empezar' : 'Siguiente';
  $('tourSaltar').style.visibility = tourIdx===TOUR.length-1 ? 'hidden' : 'visible';
}
$('tourSig').addEventListener('click', ()=>{ if(tourIdx<TOUR.length-1){ tourIdx++; pintarTour(); } else cerrarTour(); });
$('tourSaltar').addEventListener('click', cerrarTour);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('tour').hidden) cerrarTour(); });
try{ if(!localStorage.getItem('suite_tour_visto')) setTimeout(()=>abrirTour(0), 700); }catch(e){}

/* ---------- Pedidos que llegan desde las apps ---------- */
const pendientes = new Map();
function enviarAGastos(m, intento){
  cargar('gastos');
  const f = $('frame-gastos'); let listo = false;
  try{ listo = !!(f.contentWindow && f.contentWindow.__suiteListo === true); }catch(e){}
  if(listo){ f.contentWindow.postMessage(m, location.origin); return; }
  if((intento||0) < 40){ setTimeout(()=>enviarAGastos(m,(intento||0)+1), 250); return; }
  const src = pendientes.get(m.reqId); pendientes.delete(m.reqId);
  if(src) src.postMessage({suite:'puente-res', reqId:m.reqId, ok:false, error:'timeout'}, location.origin);
}
window.addEventListener('message', e=>{
  const m = e.data;
  if(e.origin !== location.origin || !m) return;
  if(m.suite === 'abrir-menu') abrirMenu();
  else if(m.suite === 'gesto') SuiteSync.gesto();
  else if(m.suite === 'abrir-sync') abrirSync();
  else if(m.suite === 'cambiar-app' && APPS.includes(m.app)) mostrar(m.app);
  else if(m.suite === 'puente' && m.para === 'gastos' && typeof m.reqId === 'string'){ pendientes.set(m.reqId, e.source); enviarAGastos(m, 0); }
  else if(m.suite === 'puente-res'){ const src = pendientes.get(m.reqId); pendientes.delete(m.reqId); if(src) src.postMessage(m, location.origin); }
});

/* ---------- Aviso de espacio: los datos viven en el navegador (unos 5 MB por dirección) ---------- */
function usoAlmacenamiento(){ let n = 0; try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); n += k.length + (localStorage.getItem(k)||'').length; } }catch(e){} return n; }
function avisarEspacio(){
  const pct = usoAlmacenamiento()/5000000; if(pct < 0.7) return;
  let ult = 0; try{ ult = parseInt(localStorage.getItem('suite_aviso_espacio')||'0',10); }catch(e){}
  if(Date.now()-ult < 7*86400000) return;
  try{ localStorage.setItem('suite_aviso_espacio', String(Date.now())); }catch(e){}
  toast('Tu espacio en este dispositivo va en '+Math.round(pct*100)+'%. Haz un respaldo (⋯ → Exportar) y borra movimientos viejos que ya no necesites.', null, null, 14000);
}
window.__avisarEspacio = avisarEspacio;
setTimeout(avisarEspacio, 4000); setInterval(avisarEspacio, 3600000);
/* ---------- Pedir almacenamiento persistente (evita que el navegador borre tus datos) ---------- */
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

/* ---------- Pista única para iPhone/iPad ---------- */
if(esIOS && !esStandalone()){
  let visto = false; try{ visto = localStorage.getItem('suite_hint_ios')==='1'; }catch(e){}
  if(!visto) setTimeout(()=>{ toast('Instálala: Compartir → “Añadir a pantalla de inicio”', 'Cómo', ()=>{ guiaIOS(); }, 9000); try{ localStorage.setItem('suite_hint_ios','1'); }catch(e){} }, 2500);
}
})();
</script>
