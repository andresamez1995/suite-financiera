// ---------- matemática financiera ----------
function vpCuotas(cuota,i,n){ return i===0 ? cuota*n : cuota*(1-Math.pow(1+i,-n))/i; }
// Tasa mensual implícita en (saldo, cuota, cuotas que faltan). null si los datos no son coherentes.
function tasaImplicita(saldo,cuota,n){
  if(!(saldo>0 && cuota>0 && n>=1)) return null;
  if(cuota*n < saldo*0.999) return null;                  // ni sin intereses alcanzaría a pagarse
  if(Math.abs(cuota*n - saldo) < 0.5) return 0;
  let lo = 0, hi = 0.5;
  if(vpCuotas(cuota,hi,n) >= saldo) return null;          // tasa irreal (más de 50% mensual)
  for(let k=0;k<90;k++){ const mid=(lo+hi)/2; if(vpCuotas(cuota,mid,n) > saldo) lo = mid; else hi = mid; }
  return (lo+hi)/2;
}
// Cuántas cuotas faltan para saldar 'saldo' pagando 'cuota' a tasa mensual i (Infinity si la cuota no cubre los intereses)
function cuotasFaltan(saldo,cuota,i){
  if(saldo<=0) return 0; if(!(cuota>0)) return Infinity;
  if(i===0) return saldo/cuota;
  const x = 1 - saldo*i/cuota; if(x<=0) return Infinity;
  return -Math.log(x)/Math.log(1+i);
}
// Simulación mes a mes (con abono extra opcional): {n, interes}
function simularDeuda(saldo,cuota,i,extra){
  let n = 0, interes = 0, s = saldo; const pago = cuota + (extra||0);
  while(s > 0.5 && n < 720){
    const it = s*i; if(pago <= it + 0.01) return {n:Infinity, interes:Infinity};
    const cap = Math.min(s, pago-it); interes += it; s -= cap; n++;
  }
  return {n, interes};
}
function finEstimado(falt, yaPago){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + Math.ceil(falt) - (yaPago ? 0 : 1)); return `${MESES[d.getMonth()]} ${d.getFullYear()}`; }
function yaPagoEsteMes(st){ const k = monthKey(new Date()); return st.filas.some(f=>f.tipo==='pago' && f.date.slice(0,7)===k); }

// ---------- estado derivado de una deuda (se recalcula desde los gastos: editar o borrar un pago lo corrige solo) ----------
function pagosDeuda(d){
  return STATE.expenses.filter(e=> isRealized(e) && e.catId===d.catId && (!d.subId || e.subId===d.subId) && e.date>=d.base.fecha)
    .sort((a,b)=> a.date===b.date ? (a.timestamp||0)-(b.timestamp||0) : a.date.localeCompare(b.date));
}
function estadoDeuda(d){
  const i = d.tasaM||0, S = d.seguro||0, O = (d.cuota||0) + S;
  const ev = pagosDeuda(d).map(e=>({t:'p', date:e.date, monto:e.amount, id:e.id}))
    .concat((d.ajustes||[]).filter(a=>a.fecha>=d.base.fecha).map(a=>({t:'a', date:a.fecha, saldo:a.saldo})));
  ev.sort((a,b)=> a.date===b.date ? (a.t==='a'?1:0)-(b.t==='a'?1:0) : a.date.localeCompare(b.date));   // el extracto de un día ya incluye los pagos de ese día
  let saldo = d.base.saldo, capital = 0, interes = 0, seguros = 0, ajuste = 0; const cobrados = new Set(), filas = [], totMes = {};
  ev.forEach(x=>{
    if(x.t==='a'){ ajuste += x.saldo - saldo; saldo = x.saldo; filas.push({tipo:'ajuste', date:x.date, saldo}); return; }
    const key = x.date.slice(0,7); let it = 0, sg = 0; totMes[key] = (totMes[key]||0) + x.monto;
    if(!cobrados.has(key)){ cobrados.add(key); sg = Math.min(S, x.monto); it = Math.min(x.monto-sg, fixNum(saldo*i)); }   // el seguro y los intereses del mes se cobran una sola vez
    const cap = Math.min(Math.max(0, x.monto-sg-it), saldo);
    saldo = fixNum(saldo-cap); capital += cap; interes += it; seguros += sg;
    filas.push({tipo:'pago', date:x.date, monto:x.monto, seguro:fixNum(sg), interes:fixNum(it), capital:fixNum(cap), saldo});
  });
  const mk = STATE.viewingMonth, delMes = filas.filter(f=>f.tipo==='pago' && f.date.slice(0,7)===mk);
  const abonos = O>0 ? Object.values(totMes).reduce((t,T)=>t+Math.max(0,T-O),0) : 0;       // lo que se pagó por encima de cuota + seguro
  return { saldo:fixNum(saldo), capital:fixNum(capital), interes:fixNum(interes), seguros:fixNum(seguros), abonos:fixNum(abonos), ajuste:fixNum(ajuste), filas,
    mes:{ pagado:fixNum(delMes.reduce((t,f)=>t+f.monto,0)), capital:fixNum(delMes.reduce((t,f)=>t+f.capital,0)), interes:fixNum(delMes.reduce((t,f)=>t+f.interes,0)) } };
}
function deudaDeCategoria(catId, subId){ return STATE.debts.find(d=> d.catId===catId && (!d.subId || d.subId===subId)) || null; }
function dividirPago(d, monto, fecha){
  const st = estadoDeuda(d), i = d.tasaM||0, S = d.seguro||0, O = (d.cuota||0)+S, key = (fecha||today()).slice(0,7);
  const ya = st.filas.some(f=>f.tipo==='pago' && f.date.slice(0,7)===key);
  let sg = 0, it = 0, cap, abono;
  if(!ya){ sg = Math.min(S, monto); it = Math.min(monto-sg, fixNum(st.saldo*i)); cap = Math.max(0, monto-sg-it); abono = Math.max(0, monto-O); }
  else { cap = monto; abono = monto; }
  return {sg:fixNum(sg), it:fixNum(it), cap:fixNum(Math.min(cap, st.saldo)), abono:fixNum(abono), ya};
}

    mesCap:fixNum(creditos.reduce((t,x)=>t+x.st.mes.capital,0)), mesInt:fixNum(creditos.reduce((t,x)=>t+x.st.mes.interes,0)) };

// Proyección si solo se paga la cuota hasta terminar (todas las deudas con cuotas)
function proyeccionDeudas(R){
  const det = R.creditos.filter(x=>x.st.saldo>0.5).map(({d,st})=>{
    const i = d.tasaM||0, sim = simularDeuda(st.saldo, d.cuota, i, 0);
    if(sim.n===Infinity) return {d, st, ok:false};
    const seg = (d.seguro||0)*sim.n;
    return {d, st, ok:true, n:sim.n, interes:sim.interes, seguros:seg, total:st.saldo+sim.interes+seg, ea:eaDeM(i)};
  });
  const buenos = det.filter(x=>x.ok), sum = k=>buenos.reduce((t,x)=>t+x[k],0);
  return { det, interes:sum('interes'), seguros:sum('seguros'), total:sum('total'), saldo:buenos.reduce((t,x)=>t+x.st.saldo,0), incompletas:det.filter(x=>!x.ok).map(x=>x.d.nombre) };
}
function consejoAbono(R){
  const P = proyeccionDeudas(R), cand = P.det.filter(x=>x.ok); if(!cand.length) return '';
  const top = cand.reduce((a,b)=> b.ea>a.ea ? b : a), d = top.d, i = d.tasaM||0, cuotaT = d.cuota+(d.seguro||0);
  const extra = Math.max(100000, Math.round(cuotaT*0.10/50000)*50000);
  const base = simularDeuda(top.st.saldo, d.cuota, i, 0), con = simularDeuda(top.st.saldo, d.cuota, i, extra);
  if(con.n===Infinity || base.n===Infinity) return '';
  const meses = base.n-con.n, ahorro = Math.round(base.interes-con.interes), varias = cand.length>1;
  return `<div class="card deb-consejo"><div class="deb-proy-t" style="margin-bottom:6px;">${ic('coins',16)} Qué te conviene</div>

}

  const A = y=>anios[y] || (anios[y] = {compras:0, tarjeta:0, consignaciones:0, entradasBanco:0, facturaE:0, meses:{}, desde:'9999-99-99'});

  STATE.expenses.forEach(e=>{ if(!isRealized(e)) return; const a = A(e.date.slice(0,4)); a.meses[e.date.slice(5,7)] = 1; if(e.date<a.desde) a.desde = e.date;
    if(esPagoDeudaGasto(e) || e.catId==='costos_financieros' || e.noGasto) return;                 // pagar deudas o intereses no es una compra
    a.compras += e.amount; if(tj.has(e.accountId)) a.tarjeta += e.amount;
    if(e.fe && !efectivo.has(e.accountId)) a.facturaE += e.amount; });              // la deducción del 1 % exige pago electrónico
  STATE.incomes.forEach(i=>{ if(!isRealized(i)) return; const a = A(i.date.slice(0,4)); a.meses[i.date.slice(5,7)] = 1; if(i.date<a.desde) a.desde = i.date; a.consignaciones += i.amount; if(banco.has(i.accountId)) a.entradasBanco += i.amount; });
  // el banco le reporta a la DIAN todo lo que entra a tus cuentas, también lo que pasas entre tus propias cuentas
  STATE.transfers.forEach(t=>{ if(t.date>today() || !banco.has(t.toId)) return; A(t.date.slice(0,4)).entradasBanco += t.amount; });
  const out = {}; Object.keys(anios).forEach(y=>{ const a = anios[y]; out[y] = {compras:fixNum(a.compras), tarjeta:fixNum(a.tarjeta), consignaciones:fixNum(a.consignaciones), entradasBanco:fixNum(a.entradasBanco), facturaE:fixNum(a.facturaE), meses:Object.keys(a.meses).length, desde:a.desde}; });
  const vivienda = {};
  STATE.debts.filter(d=>d.vivienda).forEach(d=>{ estadoDeuda(d).filas.forEach(f=>{ if(f.tipo==='pago' && f.interes>0){ const k = f.date.slice(0,7); vivienda[k] = fixNum((vivienda[k]||0)+f.interes); } }); });
  const R = resumenDeudas(), key = STATE.viewingMonth, ah = ahorroMes(key);
  return { ts:Date.now(), anios:out, vivienda,
    patrimonio:{ cuentas:fixNum(STATE.accounts.filter(a=>a.type!=='tarjeta' && a.balance>0).reduce((t,a)=>t+a.balance,0)), bienes:fixNum(STATE.bienes.reduce((t,b)=>t+b.valor,0)), deudas:R.total },
    inicio:{ mes:key, saldo:totalAccountsBalance(), ingresos:receivedIncome(key), gastos:totalExpenses(key), deuda:R.total, ahorro: ah ? ah.aporte : null, cuentas:STATE.accounts.length, movimientos:STATE.expenses.length+STATE.incomes.length } };
}

function ahorroMes(key){
  const ids = new Set(STATE.accounts.filter(esAhorro).map(a=>a.id)); if(!ids.size) return null;
  let aporte = 0;
  STATE.transfers.forEach(t=>{ if(t.date.slice(0,7)!==key) return; if(ids.has(t.toId) && !ids.has(t.fromId)) aporte += t.amount; if(ids.has(t.fromId) && !ids.has(t.toId)) aporte -= t.amount; });
  const ing = receivedIncome(key), metaPct = STATE.accounts.filter(esAhorro).reduce((t,a)=>t+(a.pctMes||0),0);
  return { aporte:fixNum(aporte), ing, pct: ing>0 ? aporte/ing : 0, metaPct, objetivo: fixNum(ing*metaPct/100) };
}

/* ================= TARJETAS DE CRÉDITO: compras a cuotas y pagos ================= */
// Comprar con la tarjeta = un GASTO normal (con su categoría real) que sube la deuda. Pagar la tarjeta = una TRANSFERENCIA desde tu banco: baja la deuda y no es gasto.
const CUOTAS_OPC = [1,2,3,4,6,9,12,18,24,36,48,60];
function cuotasOpts(sel){
  sel = sel || 1; const l = CUOTAS_OPC.includes(sel) ? CUOTAS_OPC : CUOTAS_OPC.concat([sel]).sort((a,b)=>a-b);
  return l.map(n=>`<option value="${n}" ${n===sel?'selected':''}>${n===1 ? '1 (de contado)' : n+' cuotas'}</option>`).join('');
}
function idxMes(date){ return parseInt(date.slice(0,4),10)*12 + parseInt(date.slice(5,7),10) - 1; }
function cuotaValorTarjeta(a, e){
  const n = e.cuotas || 1, P = e.amount, i = (a && a.tasaM) || 0;
  if(n<=1) return fixNum(P);
  return Math.round(i>0 ? P*i/(1-Math.pow(1+i,-n)) : P/n);   // cuotas en pesos enteros
}
function primerMesCuota(a, e){ let m = idxMes(e.date); if(a && a.diaCorte && parseInt(e.date.slice(8,10),10) > a.diaCorte) m++; return m; }   // compras después del corte entran al extracto siguiente
function comprasTarjeta(a){ return STATE.expenses.filter(e=>e.accountId===a.id && isRealized(e)); }
function cuotasDelMes(a, key){
  const k = idxMes(key+'-01'), out = [];
  comprasTarjeta(a).forEach(e=>{ const n = e.cuotas||1, m0 = primerMesCuota(a,e); if(k>=m0 && k<m0+n) out.push({e, k:k-m0+1, n, valor:cuotaValorTarjeta(a,e)}); });
  return out;
}
function cuotasPendientes(a, key){
  const k = idxMes(key+'-01'), out = [];
  comprasTarjeta(a).forEach(e=>{ const n = e.cuotas||1; if(n<=1) return; const m0 = primerMesCuota(a,e), faltan = m0+n-1-k; if(faltan>0) out.push({e, faltan:Math.min(faltan,n), n, valor:cuotaValorTarjeta(a,e)}); });
  return out;
}
function resumenTarjeta(a){
  const key = STATE.viewingMonth, deuda = Math.max(0, -(a.balance||0)), cupo = a.cupo||0;
  const mes = cuotasDelMes(a,key), pend = cuotasPendientes(a,key);
  return { deuda, cupo, disp: cupo>0 ? Math.max(0, cupo-deuda) : null, uso: cupo>0 ? Math.min(1, deuda/cupo) : 0,
    esteMes: fixNum(mes.reduce((t,c)=>t+c.valor,0)), nMes: mes.length, pend, porFacturar: fixNum(pend.reduce((t,c)=>t+c.valor*c.faltan,0)) };
}

// Parte de intereses de las cuotas que vencen en el extracto de un mes (sistema de cuota fija, con la tasa de la tarjeta)
function interesCuotasMes(a, key){
  const i = (a && a.tasaM) || 0; if(!(i>0)) return 0;
  return fixNum(cuotasDelMes(a, key).reduce((t,c)=>{ if(c.n<=1) return t; const P = c.e.amount, A = c.valor, f = Math.pow(1+i, c.k-1);
    return t + Math.max(0, (P*f - A*(f-1)/i) * i); }, 0));
}

// `previo`: el gasto que se está editando (su valor ya está descontado del saldo de su cuenta)
async function confirmarGasto(a, monto, fecha, previo){
  if(!a) return true;
  const devuelto = (previo && previo.accountId===a.id && previo.date<=today()) ? previo.amount : 0;
  if(a.type==='ahorro' && !(await SuiteUI.confirmar(`"${a.name}" es una cuenta de ahorro. ¿Seguro que quieres gastar desde ahí?`, {peligro:false}))) return false;
  if(esTarjeta(a)){
    if(a.cupo>0){ const disp = a.cupo - Math.max(0,-(a.balance||0)) + devuelto;
      if(monto>disp && !(await SuiteUI.confirmar(`La compra (${fmtCOP(monto)}) supera el cupo disponible de "${a.name}" (${fmtCOP(Math.max(0,disp))}). ¿Registrarla igual?`, {peligro:false}))) return false; }
    return true;
  }
  if(fecha<=today()){ const saldo = (a.balance||0) + devuelto;
    if(monto>saldo && !(await SuiteUI.confirmar(a.type==='efectivo'
      ? `Tienes ${fmtCOP(saldo)} en "${a.name}" y el gasto es de ${fmtCOP(monto)}. Revisa si salió de otra cuenta o si falta registrar un retiro. ¿Registrarlo igual?`
      : `El gasto (${fmtCOP(monto)}) supera el saldo de "${a.name}" (${fmtCOP(saldo)}). La cuenta quedará en negativo. ¿Registrarlo igual?`, {peligro:false}))) return false;
  }
  return true;
}

      <div class="deb-proy-r deb-proy-tot"><span>Total que pagarías hasta terminar</span><b>~${fmtCOP(Math.round(P.total))}</b></div>
      ${P.saldo>0 ? `<div class="sub-label" style="margin:6px 0 0; line-height:1.5;">Por cada $1 que debes hoy de capital pagarías ~<b>$${(P.total/P.saldo).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})}</b> en total.${P.incompletas.length ? ' No incluye «'+esc(P.incompletas.join('», «'))+'»: su cuota no cubre los intereses.' : ''}${R.totTarj>0 ? ' Las tarjetas no se incluyen.' : ''}</div>` : ''}</div>` : '';
  const hero = `<div class="card s-hero"><h3>Lo que debes</h3>
    <div class="big-num" style="margin-top:6px;">${fmtBig(R.total)}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
      <span class="pill" style="background:var(--surface-2); color:var(--text-dim);">Créditos ${fmtCOP(R.totCred)}</span>
      <span class="pill" style="background:var(--surface-2); color:var(--text-dim);">Tarjetas ${fmtCOP(R.totTarj)}</span></div>
    <div class="kpis" style="margin-top:12px;">
      <div class="kpi"><div class="l">Cuotas al mes</div><div class="v">${fmtCompact(R.cuotas)}</div></div>
      <div class="kpi"><div class="l">${esc(monthLabel(STATE.viewingMonth).split(' ')[0])}: capital</div><div class="v" style="color:var(--positive)">${fmtCompact(R.mesCap)}</div></div>
      <div class="kpi"><div class="l">${esc(monthLabel(STATE.viewingMonth).split(' ')[0])}: intereses</div><div class="v" style="color:var(--danger)">${fmtCompact(R.mesInt)}</div></div></div>${proyHtml}</div>`;
  const cards = R.creditos.map(({d,st})=>{
    const pr = progresoDeuda(d,st), falt = cuotasFaltan(st.saldo, d.cuota, d.tasaM||0), saldada = st.saldo<=0.5;
    const sub = saldada ? '¡Deuda saldada!' : (falt===Infinity ? '⚠ La cuota no alcanza a cubrir los intereses' : `Cuota ${fmtCOP(d.cuota+(d.seguro||0))} · faltan ~${Math.ceil(falt)} cuotas · termina ~${finEstimado(falt, yaPagoEsteMes(st))}`);
    return `<button type="button" class="deb-card" data-dact="open-debt" data-id="${esc(d.id)}">
      <div class="deb-top"><span class="deb-ic">${ic('bank',20)}</span><span class="deb-name">${esc(d.nombre)}</span><span class="deb-saldo">${fmtCOP(st.saldo)}</span></div>
      <div class="deb-bar"><div style="width:${(pr*100).toFixed(1)}%;"></div></div>
      <div class="deb-sub">${esc(sub)}</div>
      <div class="deb-chips"><span>Capital pagado ${fmtCompact(st.capital)}</span><span>Intereses ${fmtCompact(st.interes)}</span>${st.seguros>0?`<span>Seguros ${fmtCompact(st.seguros)}</span>`:''}${st.abonos>0?`<span>Abonos ${fmtCompact(st.abonos)}</span>`:''}</div></button>`;
  }).join('');
  const mesTj = monthLabel(STATE.viewingMonth).split(' ')[0];
  const tarj = R.tarjetas.map(a=>{
    const r = resumenTarjeta(a), col = accColor(a);
    return `<div class="deb-card" style="--c:${esc(col)};">
      <div class="deb-top"><span class="deb-ic" style="background:color-mix(in srgb, ${esc(col)} 25%, transparent);">${ic('card',20)}</span><span class="deb-name">${esc(a.name)}</span></div>
      ${r.cupo>0
        ? `<div class="tj-disp"><span>Disponible</span><b>${fmtCOP(r.disp)}</b></div><div class="deb-bar ${r.uso>0.8?'alto':''}"><div style="width:${(r.uso*100).toFixed(1)}%;"></div></div><div class="deb-sub">Debes ${fmtCOP(r.deuda)} de un cupo de ${fmtCOP(r.cupo)} (${Math.round(r.uso*100)}% usado)</div>`
        : `<div class="tj-disp"><span>Debes</span><b>${fmtCOP(r.deuda)}</b></div><div class="deb-sub">Pon el cupo en «Editar» para ver cuánto te queda disponible.</div>`}
      ${(r.esteMes>0 || r.pend.length) ? `<div class="deb-sub" style="margin-top:6px;">En tu extracto de ${esc(mesTj)} ≈ <b>${fmtCOP(r.esteMes)}</b>${r.pend.length ? ` · te quedan ${fmtCOP(r.porFacturar)} en cuotas (${r.pend.length} compra${r.pend.length>1?'s':''})` : ''}</div>` : ''}
      <div class="deb-chips"><button type="button" class="deb-act" data-dact="pay-card" data-id="${esc(a.id)}">Pagar tarjeta</button><button type="button" class="deb-act" data-dact="tarjeta-cuotas" data-id="${esc(a.id)}">Ver cuotas</button><button type="button" class="deb-act" data-dact="edit-card" data-id="${esc(a.id)}">Editar</button></div></div>`;
  }).join('');
  return hero + consejoAbono(R) + (cards ? `<div class="acc-head"><h3 style="margin:0">Créditos</h3></div>${cards}` : '') + (tarj ? `<div class="acc-head" style="margin-top:14px;"><h3 style="margin:0">Tarjetas</h3></div>${tarj}` : '') +
    `<button class="btn btn-secondary btn-block" data-dact="add-debt" style="margin:12px 0 6px;">${ic('plus',16)} Agregar deuda o tarjeta</button>
    <details class="card" style="margin-top:12px;"><summary style="font-weight:700; cursor:pointer;">¿Cómo calculamos esto?</summary>
      <div class="sub-label" style="line-height:1.55; margin-top:8px;">Cada gasto que registres en la categoría vinculada a un crédito cuenta como un pago. Los <b>intereses del mes</b> son el saldo × la tasa mensual (se cobran una sola vez por mes); lo demás baja el capital. El <b>seguro</b> que registres se separa del primer pago de cada mes. Todo lo que pagues por encima de la cuota (con seguro) es un <b>abono a capital</b>: lo puedes pagar junto con la cuota o aparte, siempre registrándolo como gasto en la misma categoría. Si tu extracto muestra otro saldo, usa «Actualizar con mi extracto». Los seguros y comisiones de la cuota se cuentan dentro de los intereses, así que son un estimado.<br><br>En las tarjetas, las compras se registran como gasto eligiendo la tarjeta como cuenta, y el pago de la tarjeta se hace como <b>transferencia</b> desde tu banco: así no se cuenta dos veces.</div></details>`;
}

// ---------- asistente para registrar una deuda ----------
let W = null;
function abrirDeudaWizard(){
  W = {paso:0, tipo:null, nombre:'', saldo:0, fecha:today(), cuota:0, cuotaTotal:0, vivienda:false, seg:'no', segVal:0, restantes:'', plazo:'', pagadas:'', tasaModo:'calc', tasaVal:'', original:0, vinc:'auto', sel:'', cupo:0, deuda:0};
  openModal('<div id="wizBox"></div>', {center:true}); wizPintar();
}
function wizX(){ return `<button class="close-x" onclick="closeModal()" aria-label="Cerrar">${ic('x',22)}</button>`; }
function wizAyuda(titulo, texto){ return `<details class="wiz-ayuda"><summary>${titulo}</summary><div>${texto}</div></details>`; }
function wizLeer(){
  const g = id => document.getElementById(id); if(!W) return;
  const mon = id => g(id) ? parseMoneyInput(g(id)) : null;
  if(W.paso===1 && W.tipo==='credito'){ W.nombre = g('wNombre').value.trim(); W.saldo = mon('wSaldo'); W.fecha = g('wFecha').value || today(); W.vivienda = !!(g('wViv') && g('wViv').checked); }
  if(W.paso===2 && W.tipo==='credito'){ W.cuotaTotal = mon('wCuota')||0; const rs = document.querySelector('input[name=wSeg]:checked'); W.seg = rs ? rs.value : 'no'; W.segVal = W.seg==='si' ? (mon('wSegVal')||0) : 0; W.cuota = Math.max(0, W.cuotaTotal - W.segVal); W.restantes = g('wRest').value; W.plazo = g('wPlazo').value; W.pagadas = g('wPag').value; }
  if(W.paso===3 && W.tipo==='credito'){ const r = document.querySelector('input[name=wTasa]:checked'); if(r) W.tasaModo = r.value; W.tasaVal = g('wTasaVal') ? g('wTasaVal').value : ''; W.original = mon('wOrig')||0; }
  if(W.paso===4 && W.tipo==='credito'){ const r = document.querySelector('input[name=wVinc]:checked'); if(r) W.vinc = r.value; W.sel = g('wSel') ? g('wSel').value : ''; }
  if(W.paso===1 && W.tipo==='tarjeta'){ W.nombre = g('wNombre').value.trim(); W.cupo = mon('wCupo')||0; W.deuda = Math.abs(mon('wDeuda')||0); }
}
function wizSegToggle(){ const r = document.querySelector('input[name=wSeg]:checked'), b = document.getElementById('wSegBox'); if(b) b.style.display = (r && r.value==='si') ? 'block' : 'none'; }
function wizTipo(t){ W.tipo = t; W.paso = 1; wizPintar(); }
function wizAtras(){ wizLeer(); W.paso = Math.max(0, W.paso-1); if(W.paso===0) W.tipo = null; wizPintar(); }
function wizError(m){ const e = document.getElementById('wizErr'); if(e){ e.textContent = m; e.style.display = m ? 'block' : 'none'; } }
function wizRestantes(){ const r = parseInt(W.restantes,10); if(r>=1) return r; const p = parseInt(W.plazo,10), q = parseInt(W.pagadas,10); return (p>=1 && q>=0 && p>q) ? p-q : 0; }
function wizCalc(){
  const S = W.saldo, C = W.cuota, n = wizRestantes(); let i = null, fuente = 'calculada';
  if(W.tasaModo==='m'){ const v = numTxt(W.tasaVal); if(v>=0 && v<50){ i = v/100; fuente = 'dada'; } }
  else if(W.tasaModo==='ea'){ const v = numTxt(W.tasaVal); if(v>=0 && v<500){ i = mDeEA(v/100); fuente = 'dada'; } }
  else i = tasaImplicita(S, C, n);
  if(i===null || !Number.isFinite(i)) return {ok:false, n, fuente};
  const falt = cuotasFaltan(S, C, i), sim = simularDeuda(S, C, i, 0);
  return {ok:true, i, ea:eaDeM(i), n, falt, fuente, interes:sim.interes, fin: falt===Infinity ? null : finEstimado(falt, false)};
}
function wizVista(){
  wizLeer(); const box = document.getElementById('wizPrev'); if(!box) return;
  const c = wizCalc();
  if(!c.ok){ box.innerHTML = W.tasaModo==='calc' ? '<span style="color:var(--danger)">No pude calcular la tasa con esos datos. Revisa el saldo, la cuota y las cuotas que faltan: la cuota × las cuotas que faltan debe ser, al menos, el saldo.</span>' : 'Escribe la tasa para ver el resultado.'; return; }
  const dif = (c.fuente==='dada' && c.falt!==Infinity && Math.abs(c.falt-c.n)>1.5) ? `<br><span style="color:var(--necesito)">Con esa tasa y tu cuota necesitarías ~${Math.ceil(c.falt)} cuotas, y tú dijiste ${c.n}. Revisa la tasa o la cuota.</span>` : '';
  const sg = W.segVal>0 ? `Cuota sin seguro: <b>${fmtCOP(W.cuota)}</b> (el seguro de ${fmtCOP(W.segVal)} lo separo aparte).<br>` : '';
  box.innerHTML = sg + `Tasa <b>${pctTxt(c.i)}</b> mensual (<b>${pctTxt(c.ea,1)}</b> efectiva anual)${c.fuente==='calculada' ? ' — calculada con tus datos' : ''}.<br>${c.falt===Infinity ? '<span style="color:var(--danger)">Con esa tasa la cuota no alcanza ni para los intereses.</span>' : `Te faltan ~${Math.ceil(c.falt)} cuotas (terminas ~${c.fin}) y pagarías ~<b>${fmtCOP(Math.round(c.interes))}</b> de intereses desde hoy.`}${dif}`;
}
function wizSig(){
  wizLeer(); wizError('');
  if(W.paso===1){
    if(W.tipo==='tarjeta') return wizGuardarTarjeta();
    if(!W.nombre) return wizError('Ponle un nombre a la deuda.');
    if(!(W.saldo>0)) return wizError('Escribe cuánto debes hoy de capital (mira tu extracto).');
    if(!DATE_RE.test(W.fecha) || W.fecha>today()) return wizError('La fecha del saldo no puede ser futura.');
  }
  if(W.paso===2){
    if(!(W.cuotaTotal>0)) return wizError('Escribe cuánto pagas cada mes.');
    if(W.seg==='si' && !(W.segVal>0)) return wizError('Escribe el valor del seguro (o elige «No»).');
    if(W.seg==='si' && W.segVal>=W.cuotaTotal) return wizError('El seguro no puede ser igual o mayor que toda la cuota.');
    if(!(wizRestantes()>=1)) return wizError('Escribe cuántas cuotas te faltan (o el plazo total y cuántas llevas pagadas).');
  }
  if(W.paso===3){
    const c = wizCalc(); if(!c.ok) return wizError(W.tasaModo==='calc' ? 'Con esos datos no se puede calcular la tasa. Revisa el saldo, la cuota y las cuotas que faltan, o escribe la tasa si la conoces.' : 'Escribe la tasa de interés.');
  }
  if(W.paso===4) return wizGuardar();
  W.paso++; wizPintar();
}
function wizVincOpciones(){
  const usados = STATE.debts.map(d=>d.catId+'|'+(d.subId||''));
  const op = [];
  STATE.categories.forEach(c=>{
    if(c.subcats.length) c.subcats.forEach(s=>{ const v = c.id+'|'+s.id; if(!usados.includes(v)) op.push([v, `${c.icon} ${c.name} › ${s.name}`]); });
    else { const v = c.id+'|'; if(!usados.includes(v)) op.push([v, `${c.icon} ${c.name} (toda la categoría)`]); }
  });
  return op;
}
function wizPintar(){
  const box = document.getElementById('wizBox'); if(!box) return;
  const p = W.paso, cred = W.tipo==='credito', total = 4;
  const head = t=>`<div class="modal-head"><h3>${t}</h3>${wizX()}</div>`;
  const dots = cred && p>=1 ? `<div class="wiz-dots" aria-label="Paso ${p} de ${total}">${[1,2,3,4].map(k=>`<i class="${k<=p?'on':''}"></i>`).join('')}</div><div class="sub-label" style="margin:0 0 10px;">Paso ${p} de ${total}</div>` : '';
  const nav = (sig,txt) => `<div id="wizErr" class="wiz-err" style="display:none"></div><div style="display:flex; gap:10px; margin-top:16px;"><button class="btn btn-secondary" style="flex:1" onclick="wizAtras()">Atrás</button><button class="btn btn-primary" style="flex:2" onclick="${sig}">${txt}</button></div>`;
  let h = '';
  if(p===0){
    h = head('Agregar deuda o tarjeta') + `<div class="sub-label" style="margin:0 0 12px;">¿Qué quieres registrar?</div>
      <button class="wiz-op" onclick="wizTipo('credito')"><b>Un crédito con cuotas</b><span>Vivienda o leasing, vehículo, libre inversión, compra de cartera…</span></button>
      <button class="wiz-op" onclick="wizTipo('tarjeta')"><b>Una tarjeta de crédito</b><span>Compras con cupo que pagas cada mes</span></button>`;
  } else if(!cred && p===1){
    h = head('Tu tarjeta de crédito') + `<label>Nombre</label><input type="text" id="wNombre" maxlength="60" placeholder="Ej: Visa Bancolombia" value="${esc(W.nombre)}">
      <label>Cupo total (COP)</label><input type="text" id="wCupo" class="money-input" placeholder="Ej: 8.000.000" value="${formatMoneyInputValue(W.cupo)}">
      <label>Lo que debes hoy (COP)</label><input type="text" id="wDeuda" class="money-input" placeholder="0" value="${formatMoneyInputValue(W.deuda)}">
      ${wizAyuda('¿Dónde veo cuánto debo?','Está en la app de tu banco o en el extracto como «saldo total» o «deuda total de la tarjeta». Si hoy no debes nada, pon 0.')}
      <div class="sub-label" style="margin-top:10px; line-height:1.5;">Cómo funciona: las compras con la tarjeta las registras como <b>gasto</b> eligiendo esta tarjeta como cuenta (la deuda sube). Cuando la pagas, haz una <b>transferencia</b> desde tu banco hacia la tarjeta (la deuda baja y no se cuenta como gasto dos veces).</div>` + nav('wizSig()','Guardar tarjeta');
  } else if(p===1){
    h = head('Cuéntame de tu deuda') + dots + `<label>¿Cómo se llama?</label><input type="text" id="wNombre" maxlength="60" placeholder="Ej: Leasing apartamento, Compra de cartera" value="${esc(W.nombre)}">
      <label>Capital que debes hoy (COP)</label><input type="text" id="wSaldo" class="money-input" placeholder="Ej: 120.000.000" value="${formatMoneyInputValue(W.saldo)}">
      ${wizAyuda('¿Dónde lo encuentro?','En tu último extracto o en la app del banco, busca «saldo de capital», «saldo a capital» o «saldo de la obligación». <b>No</b> uses el «valor total a pagar»: ese incluye intereses y mora y es más alto.')}
      <label>¿De qué fecha es ese saldo?</label><input type="date" id="wFecha" value="${esc(W.fecha)}" max="${today()}">
      <div class="sub-label" style="margin-top:6px;">Solo contaremos como pagos los que registres desde esa fecha.</div>
      <label class="wiz-radio" style="margin-top:10px;"><input type="checkbox" id="wViv" ${W.vivienda?'checked':''}><span><b>Es un crédito de vivienda o leasing habitacional</b><br><span style="font-size:12px; color:var(--text-dim);">Sus intereses pueden bajar tu retención en la fuente: la calculadora podrá traerlos de aquí.</span></span></label>` + nav('wizSig()','Siguiente');
  } else if(p===2){
    h = head('¿Cuánto pagas?') + dots + `<label>Lo que pagas cada mes en total (COP)</label><input type="text" id="wCuota" class="money-input" placeholder="Ej: 1.503.626" value="${formatMoneyInputValue(W.cuotaTotal)}">
      ${wizAyuda('¿Qué número pongo?','Es el «valor a pagar» de tu extracto: capital + intereses + seguros. Si tu crédito es en UVR o de tasa variable la cuota cambia: pon la última y actualízala cuando cambie.')}
      <div class="sub-label" style="margin:12px 0 2px;">¿Esa cuota incluye seguros (de vida, incendio y terremoto…)?</div>
      <label class="wiz-radio"><input type="radio" name="wSeg" value="no" ${W.seg!=='si'?'checked':''} onchange="wizSegToggle()"><span>No, es solo capital e intereses</span></label>
      <label class="wiz-radio"><input type="radio" name="wSeg" value="si" ${W.seg==='si'?'checked':''} onchange="wizSegToggle()"><span><b>Sí, incluye seguro</b></span></label>
      <div id="wSegBox" style="display:${W.seg==='si'?'block':'none'};"><label>Valor del seguro cada mes (COP)</label><input type="text" id="wSegVal" class="money-input" placeholder="Ej: 30.797" value="${formatMoneyInputValue(W.segVal||'')}">
        ${wizAyuda('¿Dónde lo veo?','En el extracto, en «Distribución», suma «Seguros de vida», «Seguros de incendio y terremoto» y los demás seguros. Lo separo de tu pago para que no cuente como deuda.')}</div>
      <label style="margin-top:12px;">Cuotas que te faltan</label><input type="text" inputmode="numeric" id="wRest" placeholder="Ej: 96" value="${esc(W.restantes)}">

      <div style="display:flex; gap:10px; margin-top:8px;"><div style="flex:1"><label>Plazo total (meses)</label><input type="text" inputmode="numeric" id="wPlazo" placeholder="Ej: 180" value="${esc(W.plazo)}"></div><div style="flex:1"><label>Cuotas pagadas</label><input type="text" inputmode="numeric" id="wPag" placeholder="Ej: 84" value="${esc(W.pagadas)}"></div></div>` + nav('wizSig()','Siguiente');
  } else if(p===3){
    h = head('Los intereses') + dots + `<div class="sub-label" style="margin:0 0 8px;">No tienes que saberlo todo: con tu saldo, tu cuota y las cuotas que faltan puedo calcular la tasa.</div>
      <label class="wiz-radio"><input type="radio" name="wTasa" value="calc" ${W.tasaModo==='calc'?'checked':''} onchange="wizVista()"><span><b>No sé la tasa: calcúlala por mí</b></span></label>
      <label class="wiz-radio"><input type="radio" name="wTasa" value="m" ${W.tasaModo==='m'?'checked':''} onchange="wizVista()"><span>Sé la tasa <b>mensual</b> (%)</span></label>
      <label class="wiz-radio"><input type="radio" name="wTasa" value="ea" ${W.tasaModo==='ea'?'checked':''} onchange="wizVista()"><span>Sé la tasa <b>efectiva anual</b> (E.A. %)</span></label>
      <input type="text" inputmode="decimal" id="wTasaVal" placeholder="Ej: 1,2" value="${esc(W.tasaVal)}" oninput="wizVista()" style="margin-top:6px;">
      <div id="wizPrev" class="wiz-prev"></div>
      ${wizAyuda('¿Qué es la tasa efectiva anual?','Es el costo real del crédito en un año, ya con el efecto de pagar intereses mes a mes. En tu contrato o extracto aparece como «E.A.». Una tasa de 1% mensual equivale a ~12,7% E.A.')}
      <label style="margin-top:12px;">¿Cuánto te prestaron al inicio? (opcional)</label><input type="text" id="wOrig" class="money-input" placeholder="Para mostrar cuánto llevas pagado del total" value="${formatMoneyInputValue(W.original||'')}">` + nav('wizSig()','Siguiente');
  } else if(p===4){
    const op = wizVincOpciones(), hay = STATE.categories.find(c=>/pr[ée]stamo|deuda|cr[ée]dito/i.test(c.name));
    h = head('¿Dónde registras los pagos?') + dots + `<div class="sub-label" style="margin:0 0 10px; line-height:1.5;">Cada vez que registres un <b>gasto</b> en la categoría vinculada, lo contaré como pago de esta deuda y bajará el saldo.</div>
      <label class="wiz-radio"><input type="radio" name="wVinc" value="auto" ${W.vinc==='auto'?'checked':''}><span><b>Crear la categoría por mí</b><br><span style="font-size:12px; color:var(--text-dim);">Se crea «${esc(hay?hay.name:'Préstamos')} › ${esc(W.nombre||'tu deuda')}»</span></span></label>
      <label class="wiz-radio"><input type="radio" name="wVinc" value="sel" ${W.vinc==='sel'?'checked':''}><span><b>Usar una categoría que ya tengo</b></span></label>
      <select id="wSel" style="margin-top:6px;">${op.length ? op.map(([v,t])=>`<option value="${esc(v)}" ${W.sel===v?'selected':''}>${esc(t)}</option>`).join('') : '<option value="">No hay categorías libres</option>'}</select>` + nav('wizSig()','Guardar deuda');
  }
  box.innerHTML = h; wireMoneyInputs(box);
  if(p===3) wizVista();
}
function wizGuardarTarjeta(){
  if(!W.nombre) return wizError('Ponle un nombre a la tarjeta.');
  STATE.accounts.push({id:uid(), name:W.nombre, inicial:-Math.abs(W.deuda||0), balance:-Math.abs(W.deuda||0), type:'tarjeta', color:siguienteColor(STATE.accounts), ...(W.cupo>0 ? {cupo:W.cupo} : {})});
  STATE.ui.deudasTab = true; saveState(); closeModal(); currentView = 'cuentas'; render();
  toast('Tarjeta agregada. Registra tus compras eligiéndola como cuenta.');
}
function wizGuardar(){
  const c = wizCalc(); if(!c.ok) return wizError('Revisa los datos de la tasa.');
  let catId, subId;
  if(W.vinc==='sel'){
    if(!W.sel) return wizError('Elige una categoría.'); [catId, subId] = W.sel.split('|');
  } else {
    let cat = STATE.categories.find(x=>/pr[ée]stamo|deuda|cr[ée]dito/i.test(x.name));
    if(!cat){ cat = {id:uid(), name:'Préstamos', icon:'🏦', color:siguienteColor(STATE.categories), subcats:[]}; STATE.categories.push(cat); }
    const sub = {id:uid(), name:W.nombre, nivel:'debo'}; cat.subcats.push(sub); catId = cat.id; subId = sub.id;
  }
  STATE.debts.push({id:uid(), tipo:'credito', nombre:W.nombre, catId, subId:subId||'', base:{fecha:W.fecha, saldo:fixNum(W.saldo)}, cuota:fixNum(W.cuota), seguro:fixNum(W.segVal||0), vivienda:!!W.vivienda,
    tasaM:c.i, tasaFuente:c.fuente, original: W.original>0 ? {monto:fixNum(W.original)} : null, ajustes:[], creada:today()});
  STATE.ui.deudasTab = true; saveState(); closeModal(); currentView = 'cuentas'; render();
  toast(`Deuda guardada. Cada gasto en «${(findCat(catId)||{}).name} › ${W.nombre}» baja el saldo.`, {ms:7000});
}

function deudaExtracto(id){
  const d = STATE.debts.find(x=>x.id===id); if(!d) return;
  const v = parseMoneyInput(document.getElementById('dxSaldo'));
  if(!(v>=0) || document.getElementById('dxSaldo').value.trim()===''){ alert('Escribe el saldo de capital que ves en tu extracto.'); return; }
  (d.ajustes ||= []).push({fecha:today(), saldo:fixNum(v)}); saveState(); closeModal(); render(); abrirDeudaDetalle(id);
  toast('Saldo actualizado con tu extracto.');
}
function deudaSimular(id){
  const d = STATE.debts.find(x=>x.id===id); if(!d) return; const st = estadoDeuda(d), i = d.tasaM||0;
  const extra = parseMoneyInput(document.getElementById('dsExtra')), out = document.getElementById('dsOut');
  if(!(extra>0)){ out.textContent = 'Escribe cuánto más podrías pagar cada mes.'; return; }
  const a = simularDeuda(st.saldo, d.cuota, i, 0), b = simularDeuda(st.saldo, d.cuota, i, extra);
  if(b.n===Infinity){ out.textContent = 'Con esa cuota no se alcanza a cubrir los intereses.'; return; }
  const ahorroInt = a.interes===Infinity ? 0 : a.interes-b.interes, meses = a.n===Infinity ? 0 : a.n-b.n;
  out.innerHTML = `Pagando ${fmtCOP(d.cuota+extra)} al mes terminas en ~<b>${b.n}</b> cuotas${meses>0?` (<b>${meses}</b> meses antes)`:''} y te ahorras ~<b>${fmtCOP(Math.round(ahorroInt))}</b> de intereses.`;
}

    <label class="wiz-radio"><input type="checkbox" id="deViv" ${d.vivienda?'checked':''}><span>Es un crédito de vivienda o leasing habitacional <span style="font-size:12px; color:var(--text-dim);">(sus intereses pueden bajar tu retención)</span></span></label>

function deudaGuardarEdicion(id){
  const d = STATE.debts.find(x=>x.id===id); if(!d) return;
  const nombre = document.getElementById('deNombre').value.trim(), total = parseMoneyInput(document.getElementById('deCuota')), seg = Math.max(0, parseMoneyInput(document.getElementById('deSeg'))||0), cuota = total - seg;
  let v = numTxt(document.getElementById('deTasa').value); const tipo = document.getElementById('deTipo').value;
  if(!nombre) return wizError('Ponle un nombre.'); if(!(total>0) || !(cuota>0)) return wizError('La cuota debe ser mayor que cero (y mayor que el seguro).'); if(!(v>=0)) return wizError('Escribe la tasa.');
  const i = tipo==='ea' ? mDeEA(v/100) : v/100; if(!(i>=0 && i<=0.5)) return wizError('Esa tasa no parece correcta.');
  const [catId, subId] = document.getElementById('deVinc').value.split('|');
  if(STATE.debts.some(x=>x.id!==d.id && x.catId===catId && (x.subId||'')===(subId||''))) return wizError('Esa categoría ya está vinculada a otra deuda.');
  d.nombre = nombre; d.cuota = fixNum(cuota); d.seguro = fixNum(seg); d.vivienda = !!document.getElementById('deViv').checked; d.tasaM = i; d.tasaFuente = 'dada'; d.catId = catId; d.subId = subId||'';
  saveState(); closeModal(); render(); toast('Deuda actualizada.');
}
function gastosDePagoDeuda(d){
  return STATE.expenses.filter(e=> e.catId===d.catId && (!d.subId || e.subId===d.subId) && e.date>=d.base.fecha);
}
function deudaBorrar(id){
  const d = STATE.debts.find(x=>x.id===id); if(!d) return;
  const st = estadoDeuda(d), pagos = gastosDePagoDeuda(d), total = fixNum(pagos.reduce((t,e)=>t+e.amount,0));
  const cat = findCat(d.catId), sub = findSub(d.catId, d.subId);
  openModal(`<div class="modal-head"><h3>Eliminar deuda</h3>${wizX()}</div>
    <div style="font-size:13.5px; line-height:1.5; margin-bottom:12px;">Vas a quitar el seguimiento de <b>${esc(d.nombre)}</b> (saldo ${fmtCOP(st.saldo)}). Tus demás gastos, cuentas y categorías no se tocan.</div>
    <div class="sub-label" style="margin:0 0 6px;">¿Quieres empezar de cero? Marca lo que también quieras borrar:</div>
    ${pagos.length ? `<label class="wiz-radio"><input type="checkbox" id="dbPagos"><span>Los <b>${pagos.length}</b> gasto${pagos.length>1?'s':''} de pago registrado${pagos.length>1?'s':''} en «${esc(cat?cat.name:'?')}${sub?' › '+esc(sub.name):''}» desde el ${esc(d.base.fecha)} (suman ${fmtCOP(total)}).<br><span style="font-size:12px; color:var(--text-dim);">Ese dinero vuelve a las cuentas de donde salió.</span></span></label>` : ''}
    ${sub ? `<label class="wiz-radio"><input type="checkbox" id="dbSub"><span>La subcategoría «${esc(sub.name)}» <span style="font-size:12px; color:var(--text-dim);">(solo si queda sin gastos)</span></span></label>` : ''}
    <div style="display:flex; gap:10px; margin-top:16px;"><button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-danger" style="flex:2" onclick="deudaBorrarOk('${esc(d.id)}')">Eliminar deuda</button></div>`, {center:true});
}
function deudaBorrarOk(id){
  const d = STATE.debts.find(x=>x.id===id); if(!d) return;
  const quitarPagos = !!(document.getElementById('dbPagos') && document.getElementById('dbPagos').checked);
  const quitarSub = !!(document.getElementById('dbSub') && document.getElementById('dbSub').checked);
  const snapDeuda = JSON.parse(JSON.stringify(d)), idx = STATE.debts.indexOf(d);
  const quitados = [];
  if(quitarPagos){
    gastosDePagoDeuda(d).forEach(e=>{
      const i = STATE.expenses.indexOf(e); if(i<0) return;
      STATE.expenses.splice(i,1); quitados.push(e);
    });
  }
  STATE.debts.splice(idx,1);
  let subSnap = null;
  if(quitarSub){
    const c = findCat(d.catId), s = c && c.subcats.find(x=>x.id===d.subId);
    const enUso = STATE.expenses.some(e=>e.catId===d.catId && e.subId===d.subId) || STATE.debts.some(x=>x.catId===d.catId && (x.subId||'')===(d.subId||''));
    if(s && !enUso){ const k = c.subcats.indexOf(s); c.subcats.splice(k,1); subSnap = {catId:c.id, sub:s, idx:k}; }
  }
  saveState(); closeModal(); render();
  const partes = [quitados.length ? `${quitados.length} pago${quitados.length>1?'s':''}` : '', subSnap ? 'la subcategoría' : ''].filter(Boolean);
  toast(`Deuda eliminada${partes.length ? ' junto con '+partes.join(' y ') : ''}.`, {label:'Deshacer', ms:9000, fn:()=>{
    STATE.debts.splice(Math.min(idx, STATE.debts.length), 0, snapDeuda);
    quitados.forEach(e=>{ STATE.expenses.push(e); });
    if(subSnap){ const c = findCat(subSnap.catId); if(c && !c.subcats.some(x=>x.id===subSnap.sub.id)) c.subcats.splice(Math.min(subSnap.idx, c.subcats.length), 0, subSnap.sub); }
    saveState(); render();
  }});
}

function csvCell(v){
  if(typeof v==='number') return String(v).replace('.',',');
  let s = String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'"+s;   // evita fórmulas al abrir en Excel/Sheets
  return '"'+s.replace(/"/g,'""')+'"';
}
function downloadFile(content, filename, type){
  const url = URL.createObjectURL(new Blob([content], {type}));
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function downloadCSV(rows, filename){
  downloadFile('\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'), filename, 'text/csv;charset=utf-8;');
}
const CSV_HEAD = ['Fecha','Hora','Tipo','Categoría','Subcategoría','Descripción','Nivel','Cuenta','Monto'];
function csvRows(expenses, incomes, transfers, adjustments){
  const out = [];
  expenses.forEach(e=>{ const c=findCat(e.catId), s=findSub(e.catId,e.subId);
    out.push({d:e.date, t:e.timestamp||0, r:[e.date, e.time||'', 'Gasto', c?c.name:'Sin categoría', s?s.name:'', e.desc||'', nivelLabel(s?s.nivel:e.nivel), accName(e.accountId), -e.amount]}); });
  incomes.forEach(i=> out.push({d:i.date, t:i.timestamp||0, r:[i.date, i.time||'', 'Ingreso', '', '', i.desc||'', '', accName(i.accountId), i.amount]}));
  transfers.forEach(t=> out.push({d:t.date, t:t.timestamp||0, r:[t.date, '', 'Transferencia', '', '', accName(t.fromId)+' → '+accName(t.toId), '', '', t.amount]}));
  adjustments.forEach(a=> out.push({d:a.date, t:a.timestamp||0, r:[a.date, '', 'Ajuste de saldo', '', '', '', '', accName(a.accountId), a.amount]}));
  out.sort((x,y)=> x.d===y.d ? x.t-y.t : x.d.localeCompare(y.d));
  return [CSV_HEAD, ...out.map(x=>x.r)];
}
function exportCSV(){
  const key = STATE.viewingMonth;
  downloadCSV(csvRows(expensesOfMonth(key), incomesOfMonth(key), [], []), `movimientos_${key}.csv`);
}
function exportCSVAll(){
  downloadCSV(csvRows(STATE.expenses, STATE.incomes, STATE.transfers, STATE.adjustments), `finanzas_historial_${today()}.csv`);
}

let _toastT = null;
function toast(msg, opts){
  const {label, fn, ms=6000} = opts || {};
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${label?`<button type="button" id="toastAct">${esc(label)}</button>`:''}</div>`;
  if(label) document.getElementById('toastAct').onclick = ()=>{ clearTimeout(_toastT); root.innerHTML=''; if(fn) fn(); };
  clearTimeout(_toastT); _toastT = setTimeout(()=>{ root.innerHTML=''; }, ms);
}

function subTargetOptions(excludeCat, excludeSub){
  return STATE.categories.map(c=>{
    const subs = c.subcats.filter(s=>!(c.id===excludeCat && s.id===excludeSub));
    const list = subs.map(s=>`<option value="${esc(c.id)}|${esc(s.id)}">${esc(c.icon)} ${esc(c.name)} › ${esc(s.name)}</option>`).join('');
    return c.id===excludeCat && !excludeSub ? '' : list + (c.id===excludeCat ? '' : `<option value="${esc(c.id)}|">${esc(c.icon)} ${esc(c.name)} › (sin subcategoría)</option>`);
  }).join('');
}
function applyMove(list, val){
  const [cid, sid] = val.split('|'); const s = findSub(cid, sid);
  list.forEach(e=>{ e.catId = cid; e.subId = sid||''; if(s) e.nivel = s.nivel; });
}

function deleteAccount(id){
  const acc = accById(id); if(!acc) return;
  if(STATE.accounts.length<=1){ alert('Debes conservar al menos una cuenta.'); return; }
  const others = STATE.accounts.filter(a=>a.id!==id);
  const nE = STATE.expenses.filter(e=>e.accountId===id).length, nI = STATE.incomes.filter(i=>i.accountId===id).length;
  const nT = STATE.transfers.filter(t=>t.fromId===id||t.toId===id).length, total = nE+nI+nT;
  const finish = (tgt, moveBal)=>{
    const antes = tgt ? (tgt.balance||0) : 0, saldoBorrada = acc.balance||0;
    const swap = v => v===id ? (tgt?tgt.id:'') : v;
    STATE.expenses.forEach(e=>{ e.accountId = swap(e.accountId); });
    STATE.incomes.forEach(i=>{ i.accountId = swap(i.accountId); });
    STATE.transfers.forEach(t=>{ t.fromId = swap(t.fromId); t.toId = swap(t.toId); });
    STATE.adjustments.forEach(a=>{ a.accountId = swap(a.accountId); });
    if(tgt) STATE.transfers = STATE.transfers.filter(t=>t.fromId!==t.toId);
    STATE.accounts = STATE.accounts.filter(a=>a.id!==id);
    if(tgt){ recalcularSaldos(); tgt.inicial = fixNum((tgt.inicial||0) + (antes + (moveBal ? saldoBorrada : 0)) - (tgt.balance||0)); }
    saveState(); closeModal(); render();
    if(total) toast(tgt ? `${total} movimientos pasaron a “${tgt.name}”` : `${total} movimientos quedaron sin cuenta`, {ms:7000});
  };
  if(!total && !acc.balance){ SuiteUI.confirmar(`¿Eliminar "${acc.name}"?`).then(ok=>{ if(ok) finish(null,false); }); return; }
  openModal(`
    <div class="modal-head"><h3>Eliminar cuenta</h3><button class="close-x" onclick="closeModal()" aria-label="Cerrar">${ic('x',22)}</button></div>
    <div style="font-size:13.5px; line-height:1.5; margin-bottom:12px;"><b>${esc(acc.name)}</b> tiene ${nE} gasto${nE===1?'':'s'}, ${nI} ingreso${nI===1?'':'s'} y ${nT} transferencia${nT===1?'':'s'}${acc.balance?`, y un saldo de <b>${fmtCOP(acc.balance)}</b>`:''}.</div>
    <label>Pasar esos movimientos a</label>
    <select id="delAccTarget"><option value="">Dejarlos sin cuenta (${total} quedarán huérfanos)</option>${others.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select>
    <div id="delAccBalRow" style="display:none; align-items:center; gap:8px; margin-top:12px; font-size:13px;"><input type="checkbox" id="delAccBal" checked style="width:auto; min-height:0;"><span>Sumar su saldo (${fmtCOP(acc.balance)}) a esa cuenta</span></div>
    <div style="margin-top:18px"><button class="btn btn-primary btn-block btn-danger" id="confirmDelAcc">Eliminar cuenta</button></div>
  `, {center:true});
  const sel = document.getElementById('delAccTarget');
  sel.onchange = ()=>{ document.getElementById('delAccBalRow').style.display = (sel.value && acc.balance) ? 'flex' : 'none'; };
  document.getElementById('confirmDelAcc').onclick = ()=> finish(others.find(a=>a.id===sel.value)||null, document.getElementById('delAccBal').checked);
}

    <div id="accExAh" style="display:none"><label>Meta de ahorro (COP) — opcional</label><input type="text" id="accMeta" class="money-input" value="${editing&&editing.meta?formatMoneyInputValue(editing.meta):''}">
      <label>Quiero ahorrar este % de mis ingresos cada mes — opcional</label><input type="text" inputmode="decimal" id="accPct" placeholder="Ej: 10" value="${editing&&editing.pctMes?String(editing.pctMes).replace('.',','):''}">
      <div class="sub-label" style="margin-top:6px;">Para ahorrar, pasa dinero a esta cuenta con una <b>transferencia</b>: así no cuenta como gasto.</div></div>
    <div style="display:flex; gap:10px; margin-top:18px;">${editing?'<button class="btn btn-secondary" id="delAccBtn" style="flex:1; color:var(--danger);">Eliminar</button>':''}<button class="btn btn-primary" id="saveAccBtn" style="flex:2;">Guardar</button></div>
  `);
  const selT = document.getElementById('accType'); selT.value = tp0;
  const alt = ()=>{ const t = selT.value; document.getElementById('accExTj').style.display = t==='tarjeta'?'block':'none'; document.getElementById('accExAh').style.display = t==='ahorro'?'block':'none';
    document.getElementById('accBalLbl').innerHTML = t==='tarjeta' ? 'Lo que debes hoy (COP)' : 'Saldo actual (COP)'+(editing?' <span style="font-weight:400;">— si lo cambias se registra un ajuste</span>':''); };
  selT.onchange = alt; alt();
  if(editing) document.getElementById('delAccBtn').onclick = ()=> deleteAccount(editing.id);
  document.getElementById('saveAccBtn').onclick = ()=>{
    const name = document.getElementById('accName').value.trim(); if(!name) return;
    const type = selT.value; let balance = parseMoneyInput(document.getElementById('accBalance'));
    if(type==='tarjeta') balance = -Math.abs(balance);
    const extra = {tasaM: type==='tarjeta' ? Math.max(0, Math.min(15, parseFloat(String(document.getElementById('accTasa').value).replace(',','.'))||0))/100 : 0, diaCorte: type==='tarjeta' ? Math.max(0, Math.min(31, parseInt(document.getElementById('accCorte').value,10)||0)) : 0, cupo: type==='tarjeta' ? parseMoneyInput(document.getElementById('accCupo'))||0 : 0, meta: type==='ahorro' ? parseMoneyInput(document.getElementById('accMeta'))||0 : 0,
      pctMes: type==='ahorro' ? Math.max(0, Math.min(100, parseFloat(String(document.getElementById('accPct').value).replace(',','.'))||0)) : 0};
    const aplica = o=>{ ['cupo','meta','pctMes','tasaM','diaCorte'].forEach(k=>{ if(extra[k]>0) o[k] = extra[k]; else delete o[k]; }); };
    if(editing){
      const delta = balance - (editing.balance||0);
      if(delta!==0) STATE.adjustments.push({id:uid(), date:today(), timestamp:Date.now(), accountId:editing.id, amount:delta});
      editing.name=name; editing.type=type; editing.color=document.getElementById('accColor').value; aplica(editing);
    } else { const n = {id:uid(), name, inicial:balance, balance, type, color: document.getElementById('accColor').value}; aplica(n); STATE.accounts.push(n); }
    saveState(); closeModal(); render();
  };
}

function openSettingsModal(){
  let corruptRaw = null, corruptDate = '';
  try{ corruptRaw = localStorage.getItem(STORAGE_KEY+'_corrupto'); corruptDate = localStorage.getItem(STORAGE_KEY+'_corrupto_fecha')||''; }catch(e){}
  const sync = syncActiva();
  openModal(`
    <div class="modal-head"><h3>Ajustes</h3><button class="close-x" onclick="closeModal()" aria-label="Cerrar">${ic('x',22)}</button></div>
    <div class="backup-box" style="margin-bottom:16px; font-size:13px; color:var(--text-dim); text-align:center; line-height:1.5;">
      ${sync ? 'Tus datos están en este dispositivo y se sincronizan con tu Google Drive.' : 'Tus datos se guardan en este dispositivo.'} El respaldo de esta app y de la calculadora se hace junto, desde el menú ⋯ de la suite.
    </div>
    <label>Tema</label>
    <div class="tabs" id="themeTabs">${[[null,'Automático'],['light','Claro'],['dark','Oscuro']].map(([v,l])=>`<div class="tab ${SuiteTema.get()===v?'active':''}" data-theme-val="${v||''}">${l}</div>`).join('')}</div>
    <div class="sub-label" style="margin:6px 0 14px;">${sync ? 'Copia automática diaria en tu Drive' : 'Último respaldo: '+(ultimoRespaldo()||'nunca')} · ${STATE.expenses.length} gastos · ${STATE.incomes.length} ingresos</div>
    <label class="opc-fila"><input type="checkbox" id="optFe" ${STATE.opciones.facturaE?'checked':''}><span><b>Compras con factura electrónica</b><small>Agrega una casilla opcional al registrar un gasto. Lo marcado suma para la deducción del 1 % en tu declaración de renta (pestaña Renta de la calculadora).</small></span></label>
    <div style="display:flex; flex-direction:column; gap:12px; margin-top:14px;">
      <button class="btn btn-secondary btn-block" id="bloquesBtn">Personalizar el resumen</button>
      <button class="btn btn-primary btn-block" id="globalBackupBtn">Respaldo de las dos apps…</button>
      <button class="btn btn-secondary btn-block" id="exportAllCsvBtn">↓ Historial completo (.csv)</button>
      ${corruptRaw ? `<div class="alert-box" style="border-left:4px solid var(--danger); font-size:12.5px;">Se guardó una copia de datos dañados${corruptDate?' ('+esc(corruptDate.slice(0,10))+')':''}.<div style="display:flex; gap:8px; margin-top:8px;"><button class="btn btn-secondary" id="dlCorruptBtn" style="padding:6px 10px; font-size:12px;">Descargar copia</button><button class="btn btn-secondary" id="dropCorruptBtn" style="padding:6px 10px; font-size:12px;">Descartar</button></div></div>` : ''}
      <button class="btn btn-secondary btn-block" id="resetBtn" style="color:var(--danger);">Borrar todo y empezar limpio</button>
    </div>
  `, {center:true});
  document.getElementById('exportAllCsvBtn').onclick = exportCSVAll;
  document.getElementById('globalBackupBtn').onclick = ()=>{ closeModal(); abrirRespaldoGlobal(); };
  document.getElementById('bloquesBtn').onclick = ()=>{ closeModal(); abrirBloques(); };
  document.getElementById('optFe').onchange = e=>{ STATE.opciones.facturaE = e.target.checked; if(!e.target.checked) delete STATE.opciones.facturaE; saveState(); toast(e.target.checked ? 'Listo: al registrar un gasto verás la casilla de factura electrónica.' : 'Se quitó la casilla de factura electrónica.'); };
  if(corruptRaw){
    document.getElementById('dlCorruptBtn').onclick = ()=> downloadFile(corruptRaw, `finanzas_copia_danada_${today()}.txt`, 'text/plain');
    document.getElementById('dropCorruptBtn').onclick = async ()=>{ if(await SuiteUI.confirmar('Se eliminará definitivamente la copia dañada. ¿Continuar?')){ try{ localStorage.removeItem(STORAGE_KEY+'_corrupto'); localStorage.removeItem(STORAGE_KEY+'_corrupto_fecha'); }catch(e){} openSettingsModal(); } };
  }
  document.querySelectorAll('#themeTabs .tab').forEach(t=> t.onclick = ()=>{ SuiteTema.set(t.dataset.themeVal||null); document.querySelectorAll('#themeTabs .tab').forEach(x=>x.classList.toggle('active', x===t)); });
  document.getElementById('resetBtn').onclick = async ()=>{
    const msg = sync
      ? 'Se borrarán TODOS tus gastos, ingresos, cuentas y categorías personalizadas. Como la sincronización está activa, también se borrarán de tu Drive y de tus otros dispositivos. Si solo quieres limpiar este dispositivo, primero desconéctalo en el menú ⋯ → Sincronizar con Google Drive. ¿Continuar?'
      : 'Se borrarán TODOS tus gastos, ingresos, cuentas y categorías personalizadas de este dispositivo. Si los necesitas, descarga antes un respaldo desde el menú ⋯. ¿Continuar?';
    if(await SuiteUI.confirmar(msg, {peligro:true, ok:'Sí, borrar todo'})){ STATE = defaultState(); saveState(); closeModal(); render(); }
  };
}

viewLabel.style.cursor = 'pointer'; viewLabel.title = 'Toca para ir a otro mes';
viewLabel.onclick = ()=>{
  openModal(`<div class="modal-head"><h3>Ir a un mes</h3><button class="close-x" onclick="closeModal()" aria-label="Cerrar">${ic('x',22)}</button></div><input type="month" id="mpInput" value="${STATE.viewingMonth}"><div style="margin-top:14px;"><button class="btn btn-primary btn-block" id="mpGo">Ir</button></div>`, {center:true});
  document.getElementById('mpGo').onclick = ()=>{ const v = document.getElementById('mpInput').value; if(v){ STATE.viewingMonth = v; saveState(); closeModal(); render(); } };
};
(function(){
  let tx=null, ty=null; const vw = document.getElementById('view');
  const BLOCK = 'input,select,textarea,button,summary,label,.tabs,[contenteditable],.modal-overlay';
  vw.addEventListener('touchstart', e=>{
    if(e.touches.length!==1 || document.getElementById('modalOverlay') || (e.target.closest && e.target.closest(BLOCK))){ tx=null; return; }
    tx=e.touches[0].clientX; ty=e.touches[0].clientY;
  }, {passive:true});
  vw.addEventListener('touchend', e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
    if(Math.abs(dx)>80 && Math.abs(dy)<40) document.getElementById(dx<0?'nextMonth':'prevMonth').click(); }, {passive:true});
})();

document.getElementById('navSlotL').innerHTML = SuiteNav.selector('gastos'); document.getElementById('navSlotR').innerHTML = SuiteNav.menu(); SuiteNav.iniciar();
document.getElementById('prevMonth').innerHTML = ic('chev-left',22); document.getElementById('prevMonth').setAttribute('aria-label','Mes anterior');
document.getElementById('nextMonth').innerHTML = ic('chev-right',22); document.getElementById('nextMonth').setAttribute('aria-label','Mes siguiente');
document.getElementById('settingsBtn').innerHTML = ic('gear',20); document.getElementById('settingsBtn').setAttribute('aria-label','Ajustes');
window.addEventListener('suite-tema', ()=>{ const tt=document.getElementById('themeTabs'); if(tt) tt.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', (x.dataset.themeVal||null)===SuiteTema.get())); });

render();
/* ---------- Puente con la calculadora (la pasa el index): lista de cuentas y registro del salario ---------- */
window.addEventListener('message', e=>{
  const m = e.data;
  if(e.origin !== location.origin || !m || m.suite !== 'puente') return;
  const res = {suite:'puente-res', reqId:m.reqId, ok:false};
  try{
    if(m.op === 'cuentas'){
      res.ok = true; res.cuentas = STATE.accounts.map(a=>({id:a.id, name:a.name}));
    } else if(m.op === 'ingreso'){
      const d = m.datos || {}, monto = fixNum(d.monto), acc = accById(cleanId(d.cuentaId));
      if(!STATE.accounts.length) res.error = 'sin-cuentas';
      else if(!(monto>0)) res.error = 'monto';
      else if(!acc) res.error = 'cuenta';
      else if(!DATE_RE.test(d.fecha)) res.error = 'fecha';
      else {
        const desc = cleanText(d.desc, 120) || 'Salario';
        let inc = d.idExistente ? STATE.incomes.find(i=>i.id===cleanId(d.idExistente)) : null;
        if(inc){                                                    // ya existía: se actualiza (sin duplicar)
          inc.amount = monto; inc.date = d.fecha; inc.accountId = acc.id; inc.desc = desc;
        } else {
          inc = {id:uid(), date:d.fecha, time:'', timestamp:Date.now(), amount:monto, desc, accountId:acc.id};
          STATE.incomes.push(inc); res.creado = true;
        }
        saveState(); render();
        res.ok = true; res.id = inc.id; res.cuenta = acc.name; res.mes = inc.date.slice(0,7);
      }
    }
  }catch(err){ res.ok = false; res.error = 'interno'; }
  try{ e.source.postMessage(res, location.origin); }catch(err){}
});
/* ---------- Datos que llegan de otro dispositivo (los avisa el index al sincronizar) ---------- */
function adoptarDatosExternos(){ IDX = null; _today = null; loadState(); render(); try{ publicarResumenSuite(); }catch(e){} }
window.addEventListener('message', e=>{
  if(e.origin !== location.origin || !e.data || e.data.suite !== 'datos-actualizados') return;
  if(document.getElementById('modalOverlay') && !document.getElementById('obSave')){ window.__adoptarPendiente = true; return; }   // con un formulario abierto, se espera (la bienvenida de primer uso no cuenta)
  adoptarDatosExternos(); if(document.getElementById('obSave') && STATE.accounts.length) closeModal();
});
{ const _cerrarOriginal = closeModal; closeModal = function(){ _cerrarOriginal.apply(this, arguments); if(window.__adoptarPendiente){ window.__adoptarPendiente = false; adoptarDatosExternos(); } }; }
window.__suiteListo = true;
setTimeout(function(){ try{ publicarResumenSuite(); }catch(e){} }, 700);   // la calculadora lee este resumen: se publica al abrir, no solo al guardar

if(recoveredCorrupt) toast('Se detectó un dato dañado. Guardé una copia; puedes descargarla en ⚙ Ajustes.', {ms:12000});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden || document.getElementById('modalOverlay')) return;
  _today = null; if(today()!==_renderDay) render();   // cambió el día mientras la app estaba en segundo plano
});
</script>
