<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas — Panel Financiero</title>
<script>if(window.parent===window) location.replace('../?app=gastos'); else document.documentElement.classList.add("en-suite");   // solo funciona dentro de la suite (respaldo, sincronización y tema son globales)</script>
<link rel="stylesheet" href="../suite-tema.css">
<script src="../suite-tema.js"></script>
<script src="../suite-iconos.js"></script>
<script src="../suite-ui.js"></script>
<script src="../suite-nav.js"></script>
<style>
*{box-sizing:border-box;}
.num{font-family:var(--font-display);}
button{font-family:inherit;}

html,body{margin:0; overflow:hidden; overscroll-behavior:none;}
body{position:fixed; inset:0;}   /* ocupa exactamente lo visible: sin vh/dvh (se desfasan en Android al recargar) */
#app{max-width:var(--col); margin:0 auto; height:100%; display:flex; flex-direction:column; position:relative; overflow:hidden;}



.topbar{
  flex:0 0 auto; position:relative; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; min-height:56px; background:var(--bg); border-bottom:1px solid var(--border);
}
.topbar .month-nav{display:flex; align-items:center; gap:4px;}
.topbar-left{display:flex; align-items:center; min-width:0;}
@media (max-width:480px){ .topbar{padding:8px 10px; min-height:52px; gap:4px;} .month-label{min-width:0; font-size:14.5px;} .topbar button.icon-btn{padding:8px; min-width:40px;} }
.topbar button.icon-btn{background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; padding:10px 11px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px;}
.topbar button.icon-btn:hover{background:var(--surface-2);}
.month-label{font-size:15px; font-weight:600; min-width:110px; text-align:center;}
.topbar-right{display:flex; align-items:center; gap:4px;}
.theme-toggle,.settings-btn{background:none;border:none;font-size:18px;color:var(--text-dim);cursor:pointer;padding:8px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;}
.theme-toggle:hover,.settings-btn:hover{background:var(--surface-2);}

main{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:16px 16px 96px;}

.bottom-nav{
  position:relative; flex:0 0 auto; width:100%;
  display:flex; background:var(--surface); border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom, 0px)); z-index:25; min-height:64px;
}
.nav-btn{
  flex:1; background:none; border:none; color:var(--text-faint); display:flex; flex-direction:column;
  align-items:center; gap:3px; font-size:10.5px; padding:6px 2px; cursor:pointer; border-radius:10px;
}
.nav-btn .ic{font-size:19px;}
.nav-btn.active{color:var(--accent);}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;}
.card h3{margin:0; font-size:14px; font-weight:600; color:var(--text-dim);}
.big-num{font-size:26px; font-weight:700; letter-spacing:-0.02em; line-height:1.2;}
.sub-label{font-size:12px; color:var(--text-dim); margin-top:2px;}

.flow-bar-wrapper{margin-top:10px;}
.flow-row{margin-bottom:12px;}
.flow-label-row{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:6px;}
.bar-track{width:100%; height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.bar-fill{height:100%; border-radius:99px; transition:width 0.5s ease;}

.donut-container{display:flex; align-items:center; gap:24px; flex-wrap:wrap; justify-content:center; margin:20px 0;}
.donut{width:140px; height:140px; border-radius:50%; position:relative; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.donut-hole{width:100px; height:100px; background:var(--surface); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.donut-legend{flex:1; min-width:180px; display:flex; flex-direction:column; gap:8px;}

.stacked-stack{display:flex; height:24px; border-radius:8px; overflow:hidden; gap:2px; margin:12px 0 6px;}
.stacked-segment{height:100%; transition:width 0.3s;}

.account-row{margin-bottom:14px;}
.account-row:last-child{margin-bottom:0;}
.account-info{display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:6px;}
.account-bar-bg{height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
.account-bar-fg{height:100%; border-radius:6px;}

.pill{display:inline-flex; align-items:center; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600;}
.pill.debo{background:color-mix(in srgb, var(--debo) 18%, transparent); color:var(--debo);}
.pill.necesito{background:color-mix(in srgb, var(--necesito) 18%, transparent); color:var(--necesito);}
.pill.quiero{background:color-mix(in srgb, var(--quiero) 18%, transparent); color:var(--quiero);}

.list-item{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-item .ic-bubble{width:38px; height:38px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.list-item .ic-bubble.green{background:color-mix(in srgb, var(--positive) 15%, transparent); color:var(--positive);}
.list-item .info{flex:1; min-width:0;}
.list-item .info .title{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-item .info .meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.list-item .amount{font-weight:700; font-size:14px; white-space:nowrap;}
.list-item .amount.neg{color:var(--danger);}
.list-item .amount.pos{color:var(--positive);}

.empty-state{text-align:center; padding:24px 12px; color:var(--text-dim); font-size:13px;}
.btn{border:none; border-radius:var(--radius-sm); padding:11px 16px; font-weight:600; font-size:14px; cursor:pointer;}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn-block{width:100%;}
.btn-ghost{background:none; color:var(--text-dim); border:none; font-size:13px; cursor:pointer; padding:8px 10px; min-height:44px; min-width:44px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
.btn-ghost:hover{background:var(--surface-2);}

.fab {
  position: absolute; 
  bottom: calc(76px + env(safe-area-inset-bottom, 0px)); 
  right: 16px; 
  width: 52px; 
  height: 52px; 
  border-radius: 16px; 
  background: var(--accent); 
  color: var(--accent-ink); 
  border: none;
  font-size: 26px; 
  box-shadow: 0 4px 14px rgba(0,0,0,.2); 
  cursor: pointer; 
  z-index: 30;
}

.tabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto;}
.tab{
  padding:9px 14px; min-height:40px; display:inline-flex; align-items:center; justify-content:center; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
  font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer;
  transition: all 0.2s ease;
}
.tab.active{background:var(--text); color:var(--bg); border-color:var(--text);}
.tab-content { display: none; }
.tab-content.active { display: block; }

input,select,textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:11px 12px; color:var(--text); font-size:15px; font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:0;}
label{font-size:12.5px; color:var(--text-dim); font-weight:600; display:block; margin:12px 0 6px;}
label:first-child{margin-top:0;}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
.modal-overlay.center{align-items:center; padding:16px;}
.modal-sheet{background:var(--bg); width:100%; max-width:500px; border-radius:20px 20px 0 0; padding:18px; max-height:88vh; overflow-y:auto;}
.modal-overlay.center .modal-sheet{border-radius:20px;}
.modal-sheet{animation:sheetUp .22s ease-out;}
@keyframes sheetUp{from{transform:translateY(28px); opacity:0;} to{transform:none; opacity:1;}}
.modal-overlay:not(.center) .modal-sheet::before{content:''; display:block; width:40px; height:4px; border-radius:2px; background:var(--border); margin:-6px auto 10px;}
.ic-bubble svg,.btn svg{width:20px; height:20px;} .btn svg{width:16px; height:16px; vertical-align:-3px; margin-right:2px;}
.btn-ghost svg{width:18px; height:18px;}
.chev svg{width:14px; height:14px; vertical-align:-2px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:17px;}
.close-x{background:none; border:none; font-size:20px; color:var(--text-dim); cursor:pointer; padding:10px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px;}
.close-x:hover{background:var(--surface-2);}
.footer-note{text-align:center; font-size:11px; color:var(--text-faint); padding:18px 8px 4px; line-height:1.6;}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

.alert-box {
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
summary{list-style:none;} summary::-webkit-details-marker{display:none;}
.chev{display:inline-block; transition:transform .2s; color:var(--text-faint); font-size:12px;}
details[open] > summary .chev{transform:rotate(90deg);}
.cat-card{padding:0;} .cat-card summary{display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer;}
.cat-card .cat-body{padding:0 18px 14px;}
.nav-btn .ic svg{display:block;}
.kpis{display:flex; gap:8px; margin:12px 0;}
.kpi{flex:1; background:var(--surface-2); border-radius:12px; padding:10px; min-width:0;}
.kpi .l{font-size:11px; color:var(--text-dim);} .kpi .v{font-weight:700; font-size:14px; margin-top:2px; white-space:nowrap;}
.fold{margin-top:14px; border-top:1px solid var(--border); padding-top:12px;}
.fold > summary, .sec-sum{cursor:pointer; font-size:13px; font-weight:600; color:var(--text-dim); display:flex; justify-content:space-between; align-items:center;}
.sec-sum{margin-bottom:12px;} .sec:not([open]) .sec-sum{margin-bottom:0;}
.icon-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px;}
.ic-opt{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; font-size:20px; padding:6px 0; cursor:pointer;}
.ic-opt.sel{outline:2px solid var(--accent);}
.grp-sum{display:flex; align-items:center; gap:12px; padding:11px 0; cursor:pointer; border-bottom:1px solid var(--border);}
.grp .grp-items{padding-left:50px;}
.btn-danger-link{background:none; border:none; color:var(--danger); font-weight:600; font-size:13px; cursor:pointer; padding:10px 14px; margin:10px auto 0; display:block; min-height:40px; border-radius:8px;}
.btn-danger-link:hover{background:color-mix(in srgb, var(--danger) 12%, transparent);}
.btn-danger{background:var(--danger); color:#fff;}
#toast-root{position:fixed; left:0; right:0; bottom:calc(140px + env(safe-area-inset-bottom, 0px)); display:flex; justify-content:center; z-index:70; pointer-events:none; padding:0 16px;}
.toast{pointer-events:auto; background:var(--text); color:var(--bg); padding:11px 14px; border-radius:12px; display:flex; align-items:center; gap:14px; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:480px;}
.toast button{background:none; border:none; color:var(--accent); font-weight:700; font-size:13.5px; cursor:pointer; padding:4px 6px; min-height:32px;}
.trend-svg{width:100%; height:auto; display:block;}
.trend-svg text{fill:var(--text-faint); font-family:inherit;}
.trend-legend{display:flex; gap:14px; font-size:11.5px; color:var(--text-dim); margin-top:6px; flex-wrap:wrap;}
.trend-legend span{display:inline-flex; align-items:center; gap:5px;}
.move-row{cursor:pointer;}
.deb-card{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:10px; color:var(--text); font-family:inherit; cursor:pointer; box-shadow:var(--shadow);}
.deb-top{display:flex; align-items:center; gap:10px;}
.deb-ic{width:36px; height:36px; border-radius:11px; background:var(--surface-2); display:inline-flex; align-items:center; justify-content:center; color:var(--accent); flex:0 0 auto;}
.deb-name{flex:1; min-width:0; font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.deb-saldo{font-family:var(--font-display); font-variant-numeric:tabular-nums; font-weight:700; font-size:18px;}
.deb-bar{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin:10px 0 6px;}
.deb-bar>div{height:100%; background:var(--accent); border-radius:4px;}
.deb-bar.alto>div{background:var(--danger);}
.deb-sub{font-size:12.5px; color:var(--text-dim); line-height:1.4;}
.deb-chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; font-size:11.5px; color:var(--text-dim);}
.deb-chips>span{background:var(--surface-2); border-radius:8px; padding:3px 8px;}
.deb-act{background:var(--surface-2); color:var(--text); border:none; border-radius:10px; padding:8px 14px; min-height:40px; font-weight:600; font-size:13px; cursor:pointer;}
.deb-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; margin-top:12px;}
.deb-grid>div{background:var(--surface-2); border-radius:10px; padding:8px 10px;} .deb-grid span{display:block; font-size:11px; color:var(--text-dim);} .deb-grid b{font-size:13px; font-variant-numeric:tabular-nums;}
.deb-pagos{border:1px solid var(--border); border-radius:12px; padding:4px 10px;}
.deb-row{display:flex; gap:10px; align-items:center; padding:7px 0; font-size:12.5px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums;} .deb-row:last-child{border-bottom:none;}
.deb-proy{margin-top:14px; padding-top:12px; border-top:1px solid var(--border);}
.deb-proy-t{font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.deb-proy-r{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:4px 0; font-size:13.5px;} .deb-proy-r b{font-family:var(--font-display); font-variant-numeric:tabular-nums;}
.deb-proy-tot{border-top:1px dashed var(--border); margin-top:4px; padding-top:8px; font-weight:700;}
.deb-consejo{border-left:4px solid var(--accent);}
.tj-disp{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:10px 0 2px;} .tj-disp span{font-size:13px; color:var(--text-dim);} .tj-disp b{font-family:var(--font-display); font-size:24px; font-variant-numeric:tabular-nums;}
.wiz-op{display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; color:var(--text); font-family:inherit; cursor:pointer;}
.wiz-op b{display:block; font-size:15px; margin-bottom:3px;} .wiz-op span{font-size:12.5px; color:var(--text-dim);}
.wiz-dots{display:flex; gap:6px; margin-bottom:6px;} .wiz-dots i{flex:1; height:4px; border-radius:2px; background:var(--border);} .wiz-dots i.on{background:var(--accent);}
.wiz-ayuda{margin-top:8px; font-size:12.5px; color:var(--text-dim);} .wiz-ayuda summary{cursor:pointer; color:var(--accent); font-weight:600; min-height:32px; display:flex; align-items:center;} .wiz-ayuda>div{background:var(--surface-2); border-radius:10px; padding:10px; line-height:1.5;}
.wiz-radio{display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:13.5px; cursor:pointer;} .wiz-radio input{margin-top:3px; width:auto; min-height:0;}
.wiz-prev{background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-top:10px; font-size:13px; line-height:1.5;}
.wiz-err{background:color-mix(in srgb,var(--danger) 14%,var(--surface)); border:1px solid var(--danger); border-radius:10px; padding:8px 10px; font-size:12.5px; margin-top:12px;}
.acc-meta{display:block; height:6px; border-radius:3px; background:rgba(255,255,255,.25); margin-top:6px;} .acc-meta>span{display:block; height:100%; background:#fff; border-radius:3px;}
.acc-metatxt{font-size:11px; opacity:.92;}
.swatches{display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 4px;}
.sw{width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; position:relative;}
.sw::after{content:''; position:absolute; inset:-5px;}
.sw.on{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--text);}
.sec-peek{margin-left:auto; margin-right:10px; font-size:12.5px; font-weight:600; color:var(--text-dim); font-variant-numeric:tabular-nums;}
details[open] > summary .sec-peek{display:none;}
.trend-m{cursor:pointer; outline:none;}
.trend-m:hover .hit{fill:color-mix(in srgb, var(--accent) 10%, transparent);}
.trend-m:focus-visible .hit{stroke:var(--accent); stroke-width:1.5;}
.acc-head{display:flex; align-items:baseline; justify-content:space-between; margin:4px 2px 8px;}
.acc-carousel{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 16px 14px; margin:0 -16px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.acc-carousel::-webkit-scrollbar{display:none;}
.acc-slot{flex:0 0 min(78%, 280px); scroll-snap-align:center;}
.acc-card{width:100%; min-height:152px; border:none; border-radius:20px; padding:16px; text-align:left; cursor:pointer; color:#fff; display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden;
  background:linear-gradient(135deg, color-mix(in srgb, var(--c) 78%, #000), color-mix(in srgb, var(--c) 46%, #000)); box-shadow:0 8px 20px color-mix(in srgb, var(--c) 28%, transparent); font-family:inherit; transition:transform .15s;}
.acc-card::after{content:''; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.10);}
.acc-card:active{transform:scale(.98);}
.acc-top{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; opacity:.92;}
.acc-ic{width:34px; height:34px; border-radius:11px; background:rgba(255,255,255,.18); display:inline-flex; align-items:center; justify-content:center;}
.acc-name{font-size:15px; font-weight:700; margin-top:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.acc-bal{font-family:var(--font-display); font-variant-numeric:tabular-nums; font-size:26px; font-weight:700; letter-spacing:-.01em;}
.acc-flow{display:flex; justify-content:space-between; font-size:11.5px; opacity:.9; margin-top:auto; padding-top:8px; font-variant-numeric:tabular-nums;}
.acc-add{background:var(--surface); color:var(--text-dim); border:2px dashed var(--border); box-shadow:none; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:14px;}
.acc-add::after{display:none;}
.acc-plus{width:48px; height:48px; border-radius:50%; background:var(--surface-2); display:inline-flex; align-items:center; justify-content:center; color:var(--accent);}
@media (min-width:600px){ .acc-carousel{flex-wrap:wrap; overflow:visible; scroll-snap-type:none;} .acc-slot{flex:0 0 calc(50% - 6px);} }

/* ---- resumen por bloques, pago de tarjetas y opciones ---- */
.card .sec-titulo{font-size:15px; font-weight:700; margin:0; color:var(--text); letter-spacing:-.005em;}
.colchon-escala{display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint);}
.btn-bloques{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:48px; margin:6px 0 4px; border:1px dashed var(--border); border-radius:var(--radius); background:transparent; color:var(--text-dim); font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
.btn-bloques:hover{background:var(--surface); color:var(--text);}
.bq-fila{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
.bq-fila label{flex:1; display:flex; gap:10px; align-items:flex-start; margin:0; cursor:pointer; font-size:14px; font-weight:600; color:var(--text);}
.bq-fila label input{width:20px; height:20px; min-height:0; margin:2px 0 0; flex:0 0 auto; accent-color:var(--accent);}
.bq-fila small{display:block; font-weight:400; font-size:12px; color:var(--text-dim); line-height:1.4; margin-top:2px;}
.bq-fila.off label{color:var(--text-dim);}
.bq-mover{display:flex; gap:4px;}
.bq-mover button{width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
.bq-mover button:disabled{opacity:.3; cursor:default;}
.chip-var{font-size:12px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;}

<script>
const STORAGE_KEY = 'finanzas_app_v12';
// Bloques del Resumen que se pueden quitar o agregar (el saldo y la alerta siempre se muestran)
const BLOQUES_IDS = ['ritmo','colchon','tendencia','saldoMes','cupo','hormiga','ingresos','gastos','categorias','naturaleza'];
const BLOQUES_DEF = ['ritmo','colchon','tendencia','cupo','hormiga','ingresos','gastos','categorias','naturaleza'];
const syncActiva = () => { try{ return localStorage.getItem('suite_sync_on')==='1'; }catch(e){ return false; } };
const APP_VERSION = 13;
let storageOk = true;

/* ---------- utilidades base ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fixNum(n){ n = Number(n); if(!Number.isFinite(n)) return 0; if(Number.isInteger(n)) return n; return Math.round(n*100)/100; }
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const MONTH_RE = /^\d{4}-\d{2}$/;
const NIVELES = ['debo','necesito','quiero'];
const PALETA = ['#3F8F6B','#4C7BD9','#C98A12','#9A4A93','#D1495B','#2AA9A9','#7A6BC9','#B9693A','#5E9FB0','#8A9A3B'];
const HEX_RE = /^#[0-9a-fA-F]{6}$/;
let _coloresAsignados = false;
const colorPorIndice = i => PALETA[i % PALETA.length];
function siguienteColor(lista){ const usados = new Set(lista.map(x=>x.color)); return PALETA.find(c=>!usados.has(c)) || colorPorIndice(lista.length); }
const OLD_GLYPHS = {'⌂':'🏠','⛘':'🚌','◍':'🍽️','☘':'🐾','☺':'🙂','✚':'🧘','◈':'💳'};
let IDX = null, _today = null, recoveredCorrupt = false;

function defaultCategories(){
  return [
    {id:'hogar', name:'Hogar', icon:'🏠', subcats:[
      {id:'arriendo', name:'Arriendo', nivel:'debo'},
      {id:'internet', name:'Internet / TV / Datos', nivel:'debo'},
      {id:'electricidad', name:'Electricidad', nivel:'debo'},
      {id:'gas', name:'Gas', nivel:'debo'},
      {id:'agua', name:'Agua y alcantarillado', nivel:'debo'},
      {id:'administracion', name:'Administración', nivel:'debo'},
    ]},
    {id:'transporte', name:'Transporte', icon:'🚌', subcats:[
      {id:'transporte_publico', name:'Transporte público', nivel:'necesito'},
      {id:'app_transporte', name:'App de transporte', nivel:'quiero'},
      {id:'bicitaxi', name:'Bicitaxi', nivel:'quiero'},
    ]},
    {id:'comida', name:'Comida', icon:'🍽️', subcats:[
      {id:'mercado', name:'Mercado', nivel:'debo'},
      {id:'restaurantes', name:'Restaurantes y domicilios', nivel:'quiero'},
    ]},
    {id:'mascotas', name:'Mascotas', icon:'🐾', subcats:[
      {id:'comida_mascota', name:'Comida', nivel:'debo'},
      {id:'medicos_mascota', name:'Médicos', nivel:'necesito'},
      {id:'limpieza_mascota', name:'Limpieza', nivel:'debo'},
      {id:'juguetes_mascota', name:'Juguetes', nivel:'quiero'},
    ]},
    {id:'personales', name:'Gastos personales', icon:'🙂', subcats:[
      {id:'citas_medicas', name:'Citas Medicas', nivel:'necesito'},
      {id:'peluqueria', name:'Peluquería', nivel:'quiero'},
      {id:'compras_online', name:'Compras online', nivel:'quiero'},
      {id:'cuotas_tarjetas', name:'Cuotas de manejo de tarjetas', nivel:'debo'},
      {id:'membresias', name:'Membresías / suscripciones', nivel:'necesito'},
      {id:'citas', name:'Citas', nivel:'quiero'},
      {id:'salidas_amigos', name:'Salidas amigos', nivel:'quiero'},
    ]},
    {id:'bienestar', name:'Bienestar físico y mental', icon:'🧘', subcats:[
      {id:'psicologia', name:'Psicología', nivel:'necesito'},
      {id:'medicina_prepagada', name:'Medicina prepagada', nivel:'necesito'},
      {id:'entrenador', name:'Entrenador personal', nivel:'quiero'},
      {id:'gimnasio', name:'Gimnasio', nivel:'quiero'},
    ]},
    {id:'prestamos', name:'Préstamos', icon:'💳', subcats:[
      {id:'compra_cartera', name:'Compra de cartera', nivel:'debo'},
      {id:'credito_leasing', name:'Crédito / leasing', nivel:'debo'},
    ]},
  ];
}

function asignarColores(cats){ cats.forEach((c,i)=>{ if(!c.color) c.color = colorPorIndice(i); }); return cats; }
function defaultState(){
  return {
    version: APP_VERSION,
    opciones: {},
    viewingMonth: monthKey(new Date()),
    accounts: [],
    categories: asignarColores(defaultCategories()),
    incomes: [],
    expenses: [],
    icons: {},
    ui: {},
    transfers: [],
    adjustments: [],
    debts: [],
    bienes: [],
  };
}

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

let STATE;
const cleanText = (v,max=120)=> (typeof v==='string'||typeof v==='number') ? String(v).slice(0,max) : '';
const cleanId = v => cleanText(v,40).replace(/[^\w.\-:]/g,'_');
const numOr0 = v => { const n=Number(v); return Number.isFinite(n)?n:0; };
function makeUniq(){ const s=new Set(); return id=>{ id=cleanId(id); if(!id||s.has(id)) id=uid(); s.add(id); return id; }; }
const isObj = o => o && typeof o==='object' && !Array.isArray(o);

// Valida y limpia CUALQUIER estado (carga local o backup importado). Devuelve null si no sirve.
function sanitizeState(raw, strict){
  if(!isObj(raw)) return null;
  if(strict && !Array.isArray(raw.categories)) return null;
  const S = defaultState();
  const ua = makeUniq();
  S.accounts = (Array.isArray(raw.accounts)?raw.accounts:[]).filter(isObj).map(a=>({
    id: ua(a.id), name: cleanText(a.name,60)||'Cuenta', balance: fixNum(a.balance),
    ...(typeof a.inicial==='number' && Number.isFinite(a.inicial) ? {inicial: fixNum(a.inicial)} : {}),
    ...(['efectivo','banco','tarjeta','ahorro'].includes(a.type) ? {type:a.type} : {}),
    ...(HEX_RE.test(a.color) ? {color:a.color} : {}),
    ...(numOr0(a.cupo)>0 ? {cupo:fixNum(a.cupo)} : {}),
    ...(numOr0(a.tasaM)>0 && numOr0(a.tasaM)<=0.15 ? {tasaM:numOr0(a.tasaM)} : {}),
    ...(Number.isInteger(Number(a.diaCorte)) && Number(a.diaCorte)>=1 && Number(a.diaCorte)<=31 ? {diaCorte:Number(a.diaCorte)} : {}),
    ...(numOr0(a.meta)>0 ? {meta:fixNum(a.meta)} : {}),
    ...(numOr0(a.pctMes)>0 && numOr0(a.pctMes)<=100 ? {pctMes:numOr0(a.pctMes)} : {})
  }));
  S.accounts.forEach((a,i)=>{ if(!a.color){ a.color = colorPorIndice(i+1); _coloresAsignados = true; } });
  const ud = makeUniq();
  S.debts = (Array.isArray(raw.debts)?raw.debts:[]).filter(isObj).map(d=>{
    const b = isObj(d.base) ? d.base : {}; if(!DATE_RE.test(b.fecha) || !(numOr0(b.saldo)>=0)) return null;
    const t = Number(d.tasaM);
    return { id: ud(d.id), tipo:'credito', nombre: cleanText(d.nombre,60)||'Deuda', catId: cleanId(d.catId), subId: cleanId(d.subId),
      base:{fecha:b.fecha, saldo:fixNum(b.saldo)}, cuota: fixNum(Math.max(0,numOr0(d.cuota))),
      vivienda: d.vivienda===true, seguro: fixNum(Math.max(0,numOr0(d.seguro))), tasaM: (Number.isFinite(t) && t>=0 && t<=0.5) ? t : 0, tasaFuente: d.tasaFuente==='dada' ? 'dada' : 'calculada',
      original: (isObj(d.original) && numOr0(d.original.monto)>0) ? {monto:fixNum(d.original.monto)} : null,
      ajustes: (Array.isArray(d.ajustes)?d.ajustes:[]).filter(isObj).map(a=>(DATE_RE.test(a.fecha) && numOr0(a.saldo)>=0) ? {fecha:a.fecha, saldo:fixNum(a.saldo)} : null).filter(Boolean),
      creada: DATE_RE.test(d.creada) ? d.creada : b.fecha };
  }).filter(Boolean);
  const ub = makeUniq();
  S.bienes = (Array.isArray(raw.bienes)?raw.bienes:[]).filter(isObj).map(b=>({ id: ub(b.id), nombre: cleanText(b.nombre,60)||'Bien', tipo: ['inmueble','vehiculo','inversion','otro'].includes(b.tipo) ? b.tipo : 'otro', valor: fixNum(Math.max(0,numOr0(b.valor))) }));
  const uc = makeUniq();
  S.categories = (Array.isArray(raw.categories)?raw.categories:[]).filter(isObj).map(c=>{
    const us = makeUniq(); let icon = cleanText(c.icon,8)||'•'; if(OLD_GLYPHS[icon]) icon = OLD_GLYPHS[icon];
    let color = HEX_RE.test(c.color) ? c.color : null; if(!color){ color = colorPorIndice(S._ci||0); _coloresAsignados = true; } S._ci = (S._ci||0)+1;
    return { id: uc(c.id), name: cleanText(c.name,60)||'Categoría', icon, color,
      subcats: (Array.isArray(c.subcats)?c.subcats:[]).filter(isObj).map(s=>({
        id: us(s.id), name: cleanText(s.name,60)||'Subcategoría', nivel: NIVELES.includes(s.nivel)?s.nivel:'necesito' })) };
  });
  delete S._ci;
  if(!S.categories.length) S.categories = asignarColores(defaultCategories());
  const ue = makeUniq(), ui = makeUniq(), ut = makeUniq(), uj = makeUniq();
  S.expenses = (Array.isArray(raw.expenses)?raw.expenses:[]).filter(isObj).map(e=>{
    if(!DATE_RE.test(e.date) || !(numOr0(e.amount)>0)) return null;
    return { id: ue(e.id), date: e.date, time: cleanText(e.time,12), timestamp: numOr0(e.timestamp), amount: fixNum(e.amount),
      desc: cleanText(e.desc,120), catId: cleanId(e.catId), subId: cleanId(e.subId),
      nivel: NIVELES.includes(e.nivel)?e.nivel:'quiero', accountId: cleanId(e.accountId), applied: e.applied===false?false:true, ...(e.fe===true ? {fe:true} : {}), ...(e.noGasto===true ? {noGasto:true} : {}),
    ...(Number.isInteger(Number(e.cuotas)) && Number(e.cuotas)>1 && Number(e.cuotas)<=120 ? {cuotas:Number(e.cuotas)} : {}) };
  }).filter(Boolean);
  S.incomes = (Array.isArray(raw.incomes)?raw.incomes:[]).filter(isObj).map(i=>{
    if(!DATE_RE.test(i.date) || !(numOr0(i.amount)>0)) return null;
    return { id: ui(i.id), date: i.date, time: cleanText(i.time,12), timestamp: numOr0(i.timestamp), amount: fixNum(i.amount),
      desc: cleanText(i.desc,120), accountId: cleanId(i.accountId), applied: i.applied===false?false:true, ...(i.noIngreso===true ? {noIngreso:true} : {}) };
  }).filter(Boolean);
  S.transfers = (Array.isArray(raw.transfers)?raw.transfers:[]).filter(isObj).map(t=>{
    if(!DATE_RE.test(t.date) || !(numOr0(t.amount)>0)) return null;
    const desc = cleanText(t.desc, 80);
    return { id: ut(t.id), date: t.date, timestamp: numOr0(t.timestamp), fromId: cleanId(t.fromId), toId: cleanId(t.toId), amount: fixNum(t.amount), ...(desc ? {desc} : {}) };
  }).filter(Boolean);
  S.adjustments = (Array.isArray(raw.adjustments)?raw.adjustments:[]).filter(isObj).map(a=>{
    if(!DATE_RE.test(a.date) || !numOr0(a.amount)) return null;
    return { id: uj(a.id), date: a.date, timestamp: numOr0(a.timestamp), accountId: cleanId(a.accountId), amount: fixNum(a.amount) };
  }).filter(Boolean);
  S.icons = {};
  if(isObj(raw.icons)) Object.keys(raw.icons).slice(0,300).forEach(k=>{ const v=cleanText(raw.icons[k],8); if(v) S.icons[cleanText(k,80)] = v; });
  S.ui = {};
  if(isObj(raw.ui)) Object.keys(raw.ui).slice(0,300).forEach(k=>{ const v=raw.ui[k]; if(typeof v==='boolean'||typeof v==='number') S.ui[cleanText(k,100)] = v; });
  if(isObj(raw.opciones)){ const o = raw.opciones;
    if(o.facturaE===true) S.opciones.facturaE = true;
    if(Array.isArray(o.bloques)) S.opciones.bloques = o.bloques.filter(b=>typeof b==='string' && BLOQUES_IDS.includes(b)).filter((b,i,a)=>a.indexOf(b)===i); }
  S.viewingMonth = MONTH_RE.test(raw.viewingMonth) ? raw.viewingMonth : monthKey(new Date());
  if(DATE_RE.test(raw.lastBackup)) S.lastBackup = raw.lastBackup;
  S.version = APP_VERSION;
  return S;
}

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ storageOk = false; }
  if(raw){
    try{
      const clean = sanitizeState(JSON.parse(raw), false);
      if(!clean) throw new Error('formato');
      STATE = clean; const migro = migrarSaldoInicial(); recalcularSaldos(); if(_coloresAsignados || migro) saveState(); return;
    }catch(e){
      // Dato dañado: se guarda una copia aparte ANTES de que saveState() lo pise
      try{
        if(!localStorage.getItem(STORAGE_KEY+'_corrupto')){
          localStorage.setItem(STORAGE_KEY+'_corrupto', raw);
          localStorage.setItem(STORAGE_KEY+'_corrupto_fecha', new Date().toISOString());
        }
      }catch(_){}
      recoveredCorrupt = true;
    }
  }
  STATE = defaultState();
}
function saveState(){
  IDX = null; _today = null; recalcularSaldos();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    storageOk = true;
  }catch(e){ storageOk = false; }
  clearTimeout(window.__pubT); window.__pubT = setTimeout(()=>{ try{ publicarResumenSuite(); }catch(e){} }, 400);   // resumen para la calculadora y el inicio
}
loadState();

/* ================= HELPERS ================= */
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function fmtNum(n){
  n = fixNum(n); const d = !Number.isInteger(n);
  return n.toLocaleString('es-CO', {minimumFractionDigits: d?2:0, maximumFractionDigits: d?2:0});
}
// Filas y listas: $ ; cifras grandes: COP
function fmtCOP(n){ n=fixNum(n); return (n<0?'−':'') + '$' + fmtNum(Math.abs(n)); }
function fmtBig(n){ n=fixNum(n); return (n<0?'−':'') + 'COP ' + fmtNum(Math.abs(n)); }
function pctOf(val, total) {
  if (!total || total === 0) return '0%';
  const p = (val / total) * 100;
  return (p % 1 === 0 ? p : p.toFixed(1)) + '%';
}

function formatMoneyInputValue(n){
  if(n===null || n===undefined || n==='' || isNaN(n)) return '';
  n = Number(n);
  const hasDecimals = n % 1 !== 0;
  return n.toLocaleString('es-CO', {
    minimumFractionDigits: hasDecimals ? 2 : 0,
    maximumFractionDigits: hasDecimals ? 2 : 0
  });
}

function parseMoneyInput(el){
  if(!el) return 0;
  const raw = (el.value||'').replace(/\./g,'').replace(',', '.').replace(/[^\d.\-]/g,'');
  const v = parseFloat(raw);
  return isNaN(v) ? 0 : v;
}

function liveFormatMoney(el){
  let v = el.value;
  let neg = v.trim().startsWith('-');
  v = v.replace(/[^\d,]/g,'');
  const parts = v.split(',');
  let intPart = (parts[0]||'').replace(/^0+(?=\d)/,'');
  let decPart = parts.length>1 ? parts.slice(1).join('').slice(0,2) : null;
  let formatted = intPart ? Number(intPart).toLocaleString('es-CO') : '';
  if(decPart!==null) formatted += ',' + decPart;
  el.value = (neg?'-':'') + formatted;
}

function wireMoneyInputs(root){
  (root||document).querySelectorAll('.money-input').forEach(el=>{
    if(el.dataset.wired) return;
    el.dataset.wired = '1';
    el.setAttribute('inputmode','decimal');
    el.addEventListener('input', ()=> liveFormatMoney(el));
  });
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return MESES[m-1] + ' ' + y;
}

function today(){
  if(_today) return _today;
  const d = new Date();
  _today = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return _today;
}

function findCat(catId){ return STATE.categories.find(c=>c.id===catId); }
function findSub(catId,subId){ const c=findCat(catId); return c && c.subcats.find(s=>s.id===subId); }
function nivelLabel(n){ return n==='debo'?'Debo':n==='necesito'?'Necesito':'Quiero'; }

/* ================= CÁLCULOS ================= */
function isRealized(e){ return e.date <= today(); }
// El saldo de cada cuenta NO se guarda como un número suelto: es su saldo inicial + todos los movimientos con fecha hasta `fin`.
// Así un gasto con fecha futura cuenta solo cuando llega su día, y la sincronización entre dispositivos nunca descuadra saldos.
function saldosHasta(fin){
  const m = {}; STATE.accounts.forEach(a=>{ m[a.id] = a.inicial||0; });
  const add = (id,d)=>{ if(id in m) m[id] += d; };
  STATE.incomes.forEach(i=>{ if(i.date<=fin) add(i.accountId, +i.amount); });
  STATE.expenses.forEach(e=>{ if(e.date<=fin) add(e.accountId, -e.amount); });
  STATE.adjustments.forEach(a=>{ if(a.date<=fin) add(a.accountId, +a.amount); });
  STATE.transfers.forEach(t=>{ if(t.date<=fin){ add(t.fromId, -t.amount); add(t.toId, +t.amount); } });
  Object.keys(m).forEach(k=>{ m[k] = fixNum(m[k]); });
  return m;
}
function recalcularSaldos(){
  const hoy = today(), m = saldosHasta(hoy);
  STATE.accounts.forEach(a=>{ a.balance = m[a.id]; });
  // se siguen guardando para que una versión anterior de la app (abierta en otro dispositivo) lea datos coherentes
  STATE.expenses.forEach(e=>{ e.applied = e.date<=hoy; }); STATE.incomes.forEach(i=>{ i.applied = i.date<=hoy; });
}
// Datos de versiones anteriores: el saldo guardado ya incluía los movimientos marcados como aplicados; de ahí sale el saldo inicial
function migrarSaldoInicial(){
  let cambio = false;
  STATE.accounts.forEach(a=>{
    if(typeof a.inicial==='number') return;
    let v = a.balance||0;
    STATE.incomes.forEach(i=>{ if(i.accountId===a.id && i.applied!==false) v -= i.amount; });
    STATE.expenses.forEach(e=>{ if(e.accountId===a.id && e.applied!==false) v += e.amount; });
    STATE.adjustments.forEach(j=>{ if(j.accountId===a.id) v -= j.amount; });
    STATE.transfers.forEach(t=>{ if(t.fromId===a.id) v += t.amount; if(t.toId===a.id) v -= t.amount; });
    a.inicial = fixNum(v); cambio = true;
  });
  return cambio;
}
// Índice por mes (se reconstruye solo cuando cambian los datos)
function idx(){
  const hoy = today();
  if(IDX && IDX.hoy===hoy) return IDX;
  IDX = {exp:{}, inc:{}, ef:{}, hoy};
  STATE.expenses.forEach(e=>{ (IDX.exp[e.date.slice(0,7)] ||= []).push(e); });
  STATE.incomes.forEach(i=>{ (IDX.inc[i.date.slice(0,7)] ||= []).push(i); });
  IDX.conf = calcConfirmaciones(hoy);
  gastosEfectivos(IDX.conf).forEach(e=>{ (IDX.ef[e.date.slice(0,7)] ||= []).push(e); });
  return IDX;
}
// ---------- Compras con tarjeta de crédito: pendientes hasta que pagas la tarjeta ----------
// Comprar con la tarjeta no toca tus cuentas: la compra queda registrada (con su categoría) como PENDIENTE.
// Cuando sale plata de tus cuentas para pagar la tarjeta, ese pago CONFIRMA las compras pendientes, de la más vieja a la más nueva,
// y cada una cuenta como gasto en su categoría en el mes del pago. Así el mercado de $200.000 cuenta una sola vez.
// Lo que el pago cubre de deuda sin compra (avances, deuda de antes de registrar la tarjeta) no es gasto.
const fechaCortaG = iso => new Date(iso+'T00:00').toLocaleDateString('es-CO',{day:'numeric', month:'short'});
function calcConfirmaciones(hoy){
  const porCompra = {}, porPago = {}, esDeuda = x => x.tipo==='compra' || x.tipo==='deuda';
  STATE.accounts.filter(esTarjeta).forEach(tj=>{
    const ev = [], ts = o => o.timestamp || 0;
    if((tj.inicial||0) < 0) ev.push({d:'0000-00-00', ts:0, tipo:'deuda', monto:-tj.inicial});
    STATE.expenses.forEach(e=>{ if(e.accountId===tj.id && e.date<=hoy) ev.push({d:e.date, ts:ts(e), tipo:'compra', monto:e.amount, e}); });
    STATE.transfers.forEach(t=>{
      if(t.date>hoy) return;
      if(t.fromId===tj.id) ev.push({d:t.date, ts:ts(t), tipo:'deuda', monto:t.amount});                                       // avance o traslado
      if(t.toId===tj.id) ev.push({d:t.date, ts:ts(t), tipo: esTarjeta(accById(t.fromId)) ? 'abono' : 'pago', monto:t.amount, t});
    });
    STATE.incomes.forEach(i=>{ if(i.accountId===tj.id && i.date<=hoy) ev.push({d:i.date, ts:ts(i), tipo:'abono', monto:i.amount}); });        // devoluciones
    STATE.adjustments.forEach(j=>{ if(j.accountId===tj.id && j.date<=hoy) ev.push({d:j.date, ts:ts(j), tipo: j.amount<0 ? 'deuda' : 'abono', monto:Math.abs(j.amount)}); });
    ev.sort((a,b)=> a.d!==b.d ? a.d.localeCompare(b.d) : (esDeuda(a)?0:1)-(esDeuda(b)?0:1) || a.ts-b.ts);   // el mismo día: primero la deuda, luego el pago
    const cola = []; let favor = 0, favorPago = null, favorEsPago = false;   // pagaste de más: cubre compras siguientes apenas ocurren
    ev.forEach(x=>{
      if(esDeuda(x)){
        const it = {pend:x.monto, e:x.e||null};
        if(it.e) porCompra[it.e.id] = {conf:[], pend:it.pend};
        if(favor>0.005){ const u = Math.min(favor, it.pend); favor -= u; it.pend -= u;
          if(it.e){ if(favorEsPago) porCompra[it.e.id].conf.push({fecha:x.d, monto:u, pago:favorPago}); porCompra[it.e.id].pend = it.pend; } }
        if(it.pend>0.005) cola.push(it);
        return;
      }
      let resto = x.monto; const cubre = [];
      while(resto>0.005 && cola.length){
        const it = cola[0], u = Math.min(resto, it.pend); it.pend -= u; resto -= u;
        if(it.e){ porCompra[it.e.id].pend = it.pend; if(x.tipo==='pago'){ porCompra[it.e.id].conf.push({fecha:x.d, monto:u, pago:x.t.id}); cubre.push({e:it.e, monto:u}); } }
        else if(x.tipo==='pago') cubre.push({e:null, monto:u});
        if(it.pend<=0.005) cola.shift();
      }
      if(x.tipo==='pago') porPago[x.t.id] = cubre;
      if(resto>0.005){ favor += resto; favorPago = x.t ? x.t.id : null; favorEsPago = x.tipo==='pago'; }
    });
  });
  return {porCompra, porPago};
}
// Lo que cuenta como gasto: lo pagado con tus cuentas en su fecha y, de las compras con tarjeta, lo ya pagado en la fecha del pago
function gastosEfectivos(c){
  const out = [];
  STATE.expenses.forEach(e=>{
    const a = accById(e.accountId);
    if(e.noGasto) return;                                    // marcado «No cuenta como gasto»: se ve en el registro, no suma
    if(!(a && esTarjeta(a))){ out.push(e); return; }
    const pc = c.porCompra[e.id]; if(!pc) return;
    pc.conf.forEach((k,n)=> out.push(Object.assign({}, e, {id:e.id+'#'+n, date:k.fecha, amount:fixNum(k.monto), _compra:e.id, _fechaCompra:e.date})));
  });
  return out;
}
const estadoCompra = e => { const pc = idx().conf.porCompra[e.id]; if(!pc) return null; const pagado = fixNum(e.amount - pc.pend); return {pend:fixNum(pc.pend), pagado, conf:pc.conf}; };
const confirmadoPorPago = t => idx().conf.porPago[t.id] || [];
function expensesOfMonth(key){ return idx().exp[key] || []; }        // los registros tal como los anotaste (para listarlos y editarlos)
function gastosDelMes(key){ return idx().ef[key] || []; }            // lo que cuenta como gasto en ese mes
function incomesOfMonth(key){ return idx().inc[key] || []; }
function realizedExpensesOfMonth(key){ return gastosDelMes(key).filter(isRealized); }
function realizedIncomesOfMonth(key){ return incomesOfMonth(key).filter(isRealized); }
function totalExpenses(key){ return fixNum(realizedExpensesOfMonth(key).reduce((s,e)=>s+e.amount,0)); }
function totalAccountsBalance(){ return fixNum(STATE.accounts.filter(a=>a.type!=='tarjeta').reduce((s,a)=>s+(a.balance||0),0)); }
function positiveAccountsBalance(){ return fixNum(STATE.accounts.filter(a=>a.type!=='tarjeta' && a.balance>0).reduce((s,a)=>s+a.balance,0)); }

function expensesByCategory(key){
  const list = realizedExpensesOfMonth(key);
  const map = {};
  list.forEach(e=>{
    const c = findCat(e.catId);
    const name = c ? c.name : 'Otros';
    map[name] = (map[name]||0) + e.amount;
  });
  return map;
}

function expensesByNivelDetailed(key){
  const list = realizedExpensesOfMonth(key);
  const out = {debo:{total:0, items:[]}, necesito:{total:0, items:[]}, quiero:{total:0, items:[]}};
  list.forEach(e=>{
    const c = findCat(e.catId);
    const s = findSub(e.catId, e.subId);
    const nivelActual = s ? s.nivel : (e.nivel || 'quiero');
    
    if(!out[nivelActual]) return;
    out[nivelActual].total += e.amount;
    out[nivelActual].items.push({
      catName: c ? c.name : 'Otros',
      subName: s ? s.name : 'Gasto',
      amount: e.amount
    });
  });
  return out;
}

// Ingresos de verdad: sin préstamos, plata que te devuelven ni nivelaciones (marcadas «No es un ingreso»)

function receivedIncome(key){

}

function prevMonthKey(key){ const [y,m]=key.split('-').map(Number); return monthKey(new Date(y,m-2,1)); }
function lastDayOf(key){ const [y,m]=key.split('-').map(Number); return key+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); }
function monthHasData(key){ return expensesOfMonth(key).length>0 || incomesOfMonth(key).length>0; }
// Saldo total con que cerró un mes (calculado hacia atrás desde los saldos actuales)
// Saldo de CADA cuenta al cierre de un mes (reconstruye hacia atrás o proyecta hacia adelante desde el saldo actual)
function balancesAt(key){ return saldosHasta(lastDayOf(key)); }
function closingBalance(key){ const tj = new Set(STATE.accounts.filter(a=>a.type==='tarjeta').map(a=>a.id)); return fixNum(Object.entries(balancesAt(key)).filter(([id])=>!tj.has(id)).reduce((a,[,b])=>a+b,0)); }
function renderAccountsForMonth(key, esActual, esFuturo){
  if(!STATE.accounts.length) return `<div class="empty-state">No hay cuentas registradas</div>`;
  const close = balancesAt(key), open = balancesAt(prevMonthKey(key));
  const cur = {}; STATE.accounts.forEach(a=>{ cur[a.id] = a.balance||0; });
  const rows = STATE.accounts.filter(a=>a.type!=='tarjeta').map(a=>({a, bal: esActual ? cur[a.id] : close[a.id], ini: open[a.id]})).sort((x,y)=>y.bal-x.bal);
  const totalPos = rows.filter(r=>r.bal>0).reduce((t,r)=>t+r.bal,0);
  const titulo = esActual ? 'Saldo actual por cuenta' : esFuturo ? 'Saldo proyectado por cuenta al cierre' : 'Saldo por cuenta al cierre del mes';
  const fin = esActual ? 'hoy' : 'cierre';
  return `<div class="sub-label" style="margin:0 0 8px;">${titulo}</div>` + rows.map(r=>{
    const pct = r.bal>0 && totalPos>0 ? (r.bal/totalPos)*100 : (r.bal<0 ? 100 : 0), color = r.bal<0 ? 'var(--danger)' : 'var(--text)';
    const d = fixNum(r.bal - r.ini), dTxt = d===0 ? 'sin cambios' : (d>0?'+':'−')+fmtCOP(Math.abs(d));
    return `<div class="account-row">
      <div class="account-info"><span><span class="legend-dot" style="background:${accColor(r.a)}; margin-right:6px;"></span>${esc(r.a.name)} ${r.bal<0?'<span style="color:var(--text-faint);font-weight:400;font-size:11px;">(SALDO NEGATIVO)</span>':''}</span>
        <span>${fmtCOP(r.bal)} <span style="color:var(--text-faint); font-weight:500; font-size:11px;">${r.bal>0&&totalPos>0?pctOf(r.bal,totalPos):''}</span></span></div>
      <div class="account-bar-bg"><div class="account-bar-fg" style="width:${pct}%; background:${color}"></div></div>
      <div class="meta" style="font-size:11px; color:var(--text-faint); margin-top:3px;">Inicio ${fmtCOP(r.ini)} → ${fin} ${fmtCOP(r.bal)} · ${dTxt}</div>
    </div>`;
  }).join('');
}

const normName = t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const ICON_SET = ['💼','🏠','🛍️','🏦','💻','↩️','🎁','🎉','📈','🧾','💰','💵','🪙','🚗','🍽️','🛒','🧑‍🏫','🎓','🩺','🐶','📱','🎮','✈️','⚡','💧','🔥','📦','🤝','🎵','🏋️','👕','⭐'];
const ICON_KW = [[/salari|nomina|sueldo/,'💼'],[/arriendo|renta|alquiler/,'🏠'],[/venta|vend/,'🛍️'],[/interes|rendimiento|cdt/,'🏦'],[/freelance|proyecto|honorario/,'💻'],[/reembolso|devoluc/,'↩️'],[/regalo|obsequio/,'🎁'],[/prima|cesant|bonific/,'🎉'],[/comision/,'📈'],[/pension|mesada/,'🧾']];
function iconFor(name, fallback){
  const n = normName(name); if(STATE.icons && STATE.icons[n]) return STATE.icons[n];
  for(const [re,ic] of ICON_KW) if(re.test(n)) return ic;
  return fallback || '💰';
}
function colorFor(name){ let h=0; for(const ch of normName(name)) h=(h*31+ch.charCodeAt(0))%360; return `hsl(${h} 55% 50% / .18)`; }
function fmtCompact(n){
  n=Number(n)||0; const a=Math.abs(n), sg=n<0?'−':'';
  if(a>=1e6) return sg+'COP '+(a/1e6).toFixed(1).replace('.',',').replace(',0','')+' M';
  if(a>=1e4) return sg+'COP '+Math.round(a/1e3)+' mil';
  return fmtCOP(n);
}
function groupIncomes(list){
  const map = {};
  list.forEach(i=>{ const name = i.desc || 'Otros ingresos', k = normName(name);
    if(!map[k]) map[k] = {name, total:0, items:[]}; map[k].total += i.amount; map[k].items.push(i); });
  return Object.values(map).map(g=>{ g.items.sort((a,b)=> b.date.localeCompare(a.date) || (b.timestamp||0)-(a.timestamp||0)); return g; }).sort((a,b)=>b.total-a.total);
}

const FOOTER_HTML = `<div class="footer-note">Creado por <b>Andrés Amézquita</b><br>Los datos mostrados aquí son generados localmente.</div>`;
const _prevAnim = {};
function animarCifras(root){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-anim]').forEach(el=>{
    const k = el.dataset.anim+'|'+STATE.viewingMonth+'|'+currentView, to = Number(el.dataset.v);
    if(!Number.isFinite(to)) return;
    const from = _prevAnim[k]; _prevAnim[k] = to;
    if(reduce || from===undefined || from===to) return;
    const fmt = ({big:fmtBig, cop:fmtCOP, compact:fmtCompact})[el.dataset.f] || fmtCOP, pre = el.dataset.pre || '';
    const t0 = performance.now(), dur = 520;
    const entero = Number.isInteger(from) && Number.isInteger(to);
    const paso = t=>{ const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3), v = from+(to-from)*e; el.textContent = pre+fmt(entero ? Math.round(v) : v); if(p<1) requestAnimationFrame(paso); else el.textContent = pre+fmt(to); };
    requestAnimationFrame(paso);
  });
}

function viewResumen(){
  const key = STATE.viewingMonth;
  if(key < today().slice(0,7) && !monthHasData(key)) return `<div class="card"><div class="empty-state">Sin información registrada en ${monthLabel(key)}</div></div>`;
  const gasto = totalExpenses(key);
  const saldoCuentasTotal = totalAccountsBalance();
  const ingresosMes = ingresosYAvances(key);   // los avances de tarjeta cuentan como plata que entró
  
  const saldoInicial = closingBalance(prevMonthKey(key));
  const curKey = today().slice(0,7), esActual = key===curKey, esFuturo = key>curKey;
  const saldoMes = esActual ? saldoCuentasTotal : closingBalance(key);

  const fl = flujoLiquido(key), totalDisponible = saldoInicial + ingresosMes + fl.otrasEntradas - fl.otrasSalidas;   // préstamos que entran y deudas viejas que salen mueven la plata, no el gasto
  
  const saldoCuentasPositivo = positiveAccountsBalance();
  const detailedNivel = expensesByNivelDetailed(key);
  
  let pctSpentNum = totalDisponible > 0 ? (gasto / totalDisponible) * 100 : (gasto > 0 ? 100 : 0);
  let pctDisplay = String(pctSpentNum % 1 === 0 ? pctSpentNum : pctSpentNum.toFixed(1)).replace('.',',') + ' %';
  
  let alertColor, alertIcon, alertMsg;
  if(pctSpentNum <= 40) {
    alertColor = 'var(--positive)'; alertIcon = '🟢';
    alertMsg = `Has gastado el <b>${pctDisplay}</b> de tu dinero disponible. ${fraseColchon(key)}`;
  } else if(pctSpentNum <= 70) {
    alertColor = 'var(--necesito)'; alertIcon = '🟡';
    alertMsg = `Has gastado el <b>${pctDisplay}</b> de tu dinero disponible. Tu flujo es normal, pero vigila tus próximos movimientos para asegurar que tus ingresos cubran tus gastos.`;
  } else if(pctSpentNum <= 90) {
    alertColor = 'var(--warning)'; alertIcon = '🟠';
    alertMsg = `¡Ten cuidado! Has gastado el <b>${pctDisplay}</b> de tu dinero total. Estás consumiendo tus fondos rápidamente. Frena los gastos 'Quiero'.`;
  } else {
    alertColor = 'var(--danger)'; alertIcon = '🔴';
    alertMsg = `¡Peligro! Has gastado el <b>${pctDisplay}</b> de tu capacidad. Estás gastando muy por encima de tu límite y tus cuentas están a punto de quedar en cero. Evita cualquier gasto no esencial inmediatamente.`;
  }

  let bonusMsg = '';
  if (gasto > ingresosMes && ingresosMes > 0) {
    bonusMsg = `<div style="margin-top:8px; font-size:11.5px; color:var(--text-dim); border-top:1px dashed var(--border); padding-top:8px;">
      <b>Nota:</b> Aunque tienes saldo global, este mes has gastado más de lo que te ingresó (${fmtCOP(gasto)} vs ${fmtCOP(ingresosMes)}).
    </div>`;
  }

  return `
  ${backupReminder()}

function monthShift(key, delta){ const [y,m]=key.split('-').map(Number); return monthKey(new Date(y, m-1+delta, 1)); }
function renderTrend(key){
  const n = [3,6,9,12].includes(STATE.ui.trendMonths) ? STATE.ui.trendMonths : 6;
  const data = [];
  for(let i=n-1;i>=0;i--){
    const k = monthShift(key,-i), has = monthHasData(k);
    const inc = ingresosYAvances(k), exp = totalExpenses(k);
    const ini = has ? Math.max(0, closingBalance(monthShift(k,-1))) : 0;     // lo que tenías al empezar el mes
    data.push({k, has, inc, exp, ini, disp: fixNum(ini+inc)});
  }
  const chips = [3,6,9,12].map(v=>`<div class="tab ${v===n?'active':''}" data-action="trend-period" data-n="${v}" style="flex:1; text-align:center; padding:6px 4px; font-size:12px; white-space:nowrap;">${v} meses</div>`).join('');
  const withData = data.filter(d=>d.has);
  if(!withData.length){
    return `<div class="card"><div class="card-header"><h3>Tendencia</h3></div><div class="tabs">${chips}</div><div class="empty-state">Aún no hay movimientos en estos ${n} meses</div></div>`;
  }
  // Barra izquierda = lo DISPONIBLE (lo que tenías + lo que ingresó); barra derecha = lo que gastaste
  const max = Math.max(1, ...data.flatMap(d=>[d.disp,d.exp]));
  const W=320, H=150, padB=20, padT=12, plotH=H-padB-padT, gw=W/n, bw=Math.max(4, Math.min(16, gw/2-3));
  const fs = n>=9 ? 8 : 9.5, alto = v=>v/max*plotH, base = padT+plotH;
  const bars = data.map((d,i)=>{
    const cx = gw*i + gw/2, hIni = alto(d.ini), hInc = alto(d.inc), he = alto(d.exp);
    const [y,m] = d.k.split('-').map(Number), cur = d.k===key;
    const tip = `${monthLabel(d.k)}: tenías ${fmtCOP(d.ini)} + ingresó ${fmtCOP(d.inc)} = ${fmtCOP(d.disp)} disponibles · gastos ${fmtCOP(d.exp)}`;
    return `<g class="trend-m ${cur?'cur':''}" data-action="trend-go" data-k="${d.k}" role="button" tabindex="0" aria-label="Ver ${esc(tip)}"><title>${esc(tip)}</title>
      <rect class="hit" x="${(gw*i).toFixed(1)}" y="0" width="${gw.toFixed(1)}" height="${H}" rx="6" fill="${cur?'color-mix(in srgb, var(--accent) 12%, transparent)':'transparent'}"/>
      ${d.has ? `<rect x="${(cx-bw-1).toFixed(1)}" y="${(base-hIni).toFixed(1)}" width="${bw}" height="${Math.max(hIni,d.ini>0?1.5:0).toFixed(1)}" rx="2" fill="var(--accent)" opacity=".38"/>
      <rect x="${(cx-bw-1).toFixed(1)}" y="${(base-hIni-hInc).toFixed(1)}" width="${bw}" height="${Math.max(hInc,d.inc>0?1.5:0).toFixed(1)}" rx="2" fill="var(--positive)"/>
      <rect x="${(cx+1).toFixed(1)}" y="${(base-he).toFixed(1)}" width="${bw}" height="${Math.max(he,d.exp>0?1.5:0).toFixed(1)}" rx="2" fill="var(--danger)"/>` : ''}
      <text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="${fs}" ${cur?'style="font-weight:700; fill:var(--text)"':''}>${MESES[m-1].slice(0,3)}</text></g>`;
  }).join('');
  const avgI = fixNum(withData.reduce((t,d)=>t+d.inc,0)/withData.length), avgE = fixNum(withData.reduce((t,d)=>t+d.exp,0)/withData.length);
  const top = withData.reduce((a,b)=> b.exp>a.exp?b:a);
  const act = data.find(d=>d.k===key);
  const detalle = act && act.has ? `<div class="alert-box" style="margin:10px 0 4px; font-size:12.5px; line-height:1.5; display:block;"><b>${esc(monthLabel(act.k))}:</b> tenías ${fmtCOP(act.ini)} + ingresó ${fmtCOP(act.inc)} = <b>${fmtCOP(act.disp)}</b> disponibles. Gastaste ${fmtCOP(act.exp)}${act.disp>0 ? ` (${Math.round(act.exp/act.disp*100)}% de lo disponible)` : ''}.</div>` : '';
  return `<div class="card">
    <div class="card-header"><h3>Tendencia</h3></div>
    <div class="tabs" style="margin-bottom:10px;">${chips}</div>
    <svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="group" aria-label="Dinero disponible y gastos de los últimos ${n} meses">
      <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--border)"/>
      <line x1="0" y1="${padT}" x2="${W}" y2="${padT}" stroke="var(--border)" stroke-dasharray="3 3"/>
      <text x="2" y="${padT-2}" font-size="8">${esc(fmtCompact(max))}</text>
      ${bars}
    </svg>
    <div class="trend-legend"><span><span class="legend-dot" style="background:var(--accent); opacity:.45"></span>Lo que tenías</span><span><span class="legend-dot" style="background:var(--positive)"></span>Ingresos</span><span><span class="legend-dot" style="background:var(--danger)"></span>Gastos</span></div>
    <div class="sub-label" style="margin:6px 0 0;">La barra verde es lo disponible del mes (lo que tenías al empezar + lo que ingresó); la roja, lo que gastaste.</div>
    ${detalle}
    <div class="kpis"><div class="kpi"><div class="l">Ingreso promedio</div><div class="v">${fmtCompact(avgI)}</div></div><div class="kpi"><div class="l">Gasto promedio</div><div class="v">${fmtCompact(avgE)}</div></div></div>
    <div class="sub-label" style="margin-bottom:2px;">Toca un mes para verlo.</div>
    <div class="sub-label">Mes de mayor gasto: <b>${esc(monthLabel(top.k))}</b> (${fmtCOP(top.exp)})</div>
  </div>`;
}

/* ================= RESUMEN: bloques que se pueden quitar, agregar u ordenar (⚙ Ajustes → Personalizar el resumen) ================= */

  cupo:'Solo aparece si registraste tarjetas con cupo', ingresos:'De dónde vino la plata del mes', gastos:'Tus etiquetas con más gasto', categorias:'Gráfica de dona con el detalle por subcategoría', naturaleza:'Cuánto es obligatorio y cuánto es gusto'};

}
function bloquesResumen(key, gasto, ingresosMes, detailedNivel){
  const html = bloquesActivos().map(id=>{
    if(id==='tendencia') return renderTrend(key);
    if(id==='ritmo') return renderRitmo(key);
    if(id==='saldoMes') return renderSaldoMes(key);
    if(id==='cupo') return renderCupo();
    if(id==='colchon') return renderColchon();
    if(id==='hormiga') return renderHormiga(key);
    if(id==='ingresos') return seccion('top-inc', BLOQUES_NOMBRE.ingresos, ingresosMes>0 ? fmtCOP(ingresosMes) : '—', renderTopIncomes(key, ingresosMes));
    if(id==='gastos') return seccion('top-exp', BLOQUES_NOMBRE.gastos, gasto>0 ? fmtCOP(gasto) : '—', renderTopGlobalExpenses(key, gasto));
    if(id==='categorias') return seccion('cats', BLOQUES_NOMBRE.categorias, '', gasto===0 ? `<div class="empty-state">Aún no hay gastos este mes<br><button class="btn btn-secondary" data-action="add-expense" style="margin-top:10px;">+ Registrar gasto</button></div>` : renderMainCategoriesAndDonut(key, gasto), true);
    if(id==='naturaleza') return seccion('sec-nat', BLOQUES_NOMBRE.naturaleza, gasto>0 ? fmtCOP(gasto) : '—', gasto===0 ? `<div class="empty-state">Registra gastos para ver esta estructura</div>` : renderStackedNivelDetailed(detailedNivel, gasto));

  return html + `<button type="button" class="btn-bloques" data-action="bloques">${ic('sliders',18)}<span>Personalizar el resumen</span></button>`;
}
// Gráfica de líneas sencilla: series [{v:[...], color, ancho, guion}], eje X en días
function lineasSVG(series, dias, opts){
  const W = 320, H = 140, padT = 12, padB = 18, plotH = H-padT-padB, todos = series.flatMap(s=>s.v.filter(Number.isFinite));
  const min = opts && opts.desdeCero===false ? Math.min(...todos) : Math.min(0, ...todos), max = Math.max(1, ...todos), rango = (max-min) || 1;
  const x = d => (d-1)/Math.max(1,dias-1)*W, y = v => padT + plotH - (v-min)/rango*plotH;
  const lin = s => { const pts = s.v.map((v,i)=> Number.isFinite(v) ? `${x(i+1).toFixed(1)},${y(v).toFixed(1)}` : null).filter(Boolean); return pts.length>1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.ancho||2}" ${s.guion?'stroke-dasharray="4 4"':''} stroke-linejoin="round" stroke-linecap="round"/>` : ''; };
  const marcas = [1, 10, 20, dias].map(d=>`<text x="${Math.min(W-8, Math.max(6, x(d))).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9">${d}</text>`).join('');
  const area = opts && opts.area ? (()=>{ const s = series[opts.area-1], pts = s.v.map((v,i)=>Number.isFinite(v) ? [x(i+1), y(v)] : null).filter(Boolean); if(pts.length<2) return '';
    return `<path d="M${pts[0][0].toFixed(1)},${(padT+plotH).toFixed(1)} ${pts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} L${pts[pts.length-1][0].toFixed(1)},${(padT+plotH).toFixed(1)} Z" fill="${s.color}" opacity=".12"/>`; })() : '';
  const punto = opts && opts.punto ? `<circle cx="${x(opts.punto[0]).toFixed(1)}" cy="${y(opts.punto[1]).toFixed(1)}" r="4" fill="${series[0].color}" stroke="var(--surface)" stroke-width="2"/>` : '';
  return `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts && opts.aria || '')}">
    <line x1="0" y1="${padT+plotH}" x2="${W}" y2="${padT+plotH}" stroke="var(--border)"/><line x1="0" y1="${padT}" x2="${W}" y2="${padT}" stroke="var(--border)" stroke-dasharray="3 3"/>
    <text x="2" y="${padT-2}" font-size="8">${esc(fmtCompact(max))}</text>${area}${series.slice().reverse().map(lin).join('')}${punto}${marcas}</svg>`;
}
function gastoAcumulado(key){
  const [y,m] = key.split('-').map(Number), dias = new Date(y,m,0).getDate(), por = new Array(dias+1).fill(0), hoy = today();
  gastosDelMes(key).forEach(e=>{ if(e.date<=hoy) por[parseInt(e.date.slice(8,10),10)] += e.amount; });
  const out = []; let t = 0; for(let d=1; d<=dias; d++){ t += por[d]; out.push(fixNum(t)); } return out;
}
function renderRitmo(key){
  const hoyK = today().slice(0,7); if(key>hoyK) return '';                                  // mes futuro: todavía no hay gastos que comparar
  const esActual = key===hoyK, cur = gastoAcumulado(key), dia = esActual ? parseInt(today().slice(8,10),10) : cur.length;
  const pk = prevMonthKey(key), prev = monthHasData(pk) ? gastoAcumulado(pk) : null, ak = monthShift(key,-12), anio = monthHasData(ak) ? gastoAcumulado(ak) : null;
  const enDia = (arr,d) => arr ? arr[Math.min(d, arr.length)-1] : 0, va = enDia(cur, dia);
  if(!va && !prev) return seccion('bq-ritmo', BLOQUES_NOMBRE.ritmo, '', `<div class="empty-state sin-icono">Cuando registres gastos verás aquí si vas más rápido o más lento que el mes pasado.</div>`, true);
  let frase;
  if(prev && enDia(prev, dia)>0){
    const antes = enDia(prev, dia), dif = (va-antes)/antes, p = Math.round(Math.abs(dif)*100);
    frase = p<5 ? `Vas al mismo ritmo que en ${mesCorto(pk)}: al día ${dia} llevabas ${fmtCOP(antes)} y ${esActual?'hoy llevas':'este mes llevaste'} ${fmtCOP(va)}.`
      : `Al día ${dia} ${esActual?'llevas':'llevabas'} ${fmtCOP(va)}, un ${p}% ${dif>0?'más':'menos'} que en ${mesCorto(pk)} a esa altura (${fmtCOP(antes)}).`;
    if(esActual && dif>0.15 && dia>=5) frase += ` Si sigues a este ritmo, el mes podría cerrar cerca de ${fmtCOP(va/dia*cur.length)} (en ${mesCorto(pk)} fueron ${fmtCOP(prev[prev.length-1])}).`;
  } else frase = (esActual ? `Llevas ${fmtCOP(va)} gastados en ${dia} días.` : `En el mes gastaste ${fmtCOP(va)}.`) + (prev ? ` En ${mesCorto(pk)} gastaste ${fmtCOP(prev[prev.length-1])} en todo el mes.` : '');
  const dias = Math.max(cur.length, prev ? prev.length : 0, anio ? anio.length : 0);
  const series = [{v:cur.slice(0, dia), color:'var(--accent)', ancho:2.6}];
  if(prev) series.push({v:prev, color:'var(--text-faint)', ancho:1.8});
  if(anio) series.push({v:anio, color:'var(--necesito)', ancho:1.6, guion:true});
  const ley = `<div class="trend-legend"><span><span class="legend-dot" style="background:var(--accent)"></span>${esc(mesCorto(key))}</span>${prev?`<span><span class="legend-dot" style="background:var(--text-faint)"></span>${esc(mesCorto(pk))}</span>`:''}${anio?`<span><span class="legend-dot" style="background:var(--necesito)"></span>${esc(mesCorto(ak))} ${ak.slice(0,4)}</span>`:''}</div>`;
  return seccion('bq-ritmo', BLOQUES_NOMBRE.ritmo, fmtCOP(va), `${lineasSVG(series, dias, {punto:[dia, va], aria:'Gasto acumulado por día del mes'})}${ley}<div class="sub-label" style="margin:8px 0 0; line-height:1.5;">${frase}</div>`, true);
}
function saldoDiario(key){
  const [y,m] = key.split('-').map(Number), dias = new Date(y,m,0).getDate(), validas = new Set(STATE.accounts.filter(a=>!esTarjeta(a)).map(a=>a.id));
  const ini = saldosHasta(lastDayOf(prevMonthKey(key))), delta = new Array(dias+1).fill(0);
  const mov = (id,date,v)=>{ if(validas.has(id) && date.slice(0,7)===key) delta[parseInt(date.slice(8,10),10)] += v; };
  STATE.incomes.forEach(i=>mov(i.accountId, i.date, +i.amount)); STATE.expenses.forEach(e=>mov(e.accountId, e.date, -e.amount));
  STATE.adjustments.forEach(j=>mov(j.accountId, j.date, +j.amount)); STATE.transfers.forEach(t=>{ mov(t.fromId, t.date, -t.amount); mov(t.toId, t.date, +t.amount); });
  let s = [...validas].reduce((t,id)=>t+(ini[id]||0),0); const inicio = fixNum(s), out = [];
  for(let d=1; d<=dias; d++){ s += delta[d]; out.push(fixNum(s)); }
  return {inicio, dias:out};
}
function renderSaldoMes(key){
  if(!STATE.accounts.some(a=>!esTarjeta(a))) return '';
  const hoyK = today().slice(0,7), esActual = key===hoyK, esFuturo = key>hoyK, {inicio, dias} = saldoDiario(key);
  const dia = esActual ? parseInt(today().slice(8,10),10) : dias.length, ahora = dias[dia-1];
  const hoy = today(), validas = new Set(STATE.accounts.filter(a=>!esTarjeta(a)).map(a=>a.id)), enMes = d => d.slice(0,7)===key && d>hoy;
  const hayFuturos = esActual && (STATE.incomes.some(i=>validas.has(i.accountId) && enMes(i.date)) || STATE.expenses.some(e=>validas.has(e.accountId) && enMes(e.date))
    || STATE.transfers.some(t=>(validas.has(t.fromId) || validas.has(t.toId)) && enMes(t.date)));
  const real = dias.map((v,i)=> (esFuturo || i<dia) ? v : NaN), proy = hayFuturos ? dias.map((v,i)=> i>=dia-1 ? v : NaN) : null;
  const series = [{v:real, color:'var(--debo)', ancho:2.4}]; if(proy && dia<dias.length) series.push({v:proy, color:'var(--debo)', ancho:1.6, guion:true});
  const dif = inicio ? (ahora-inicio)/Math.abs(inicio) : 0, p = Math.round(Math.abs(dif)*100);
  const chip = inicio ? `<span class="chip-var ${dif<0?'baja':'sube'}">${dif<0?'−':'+'}${p}% vs. inicio del mes</span>` : '';
  const nota = esFuturo ? 'Proyección con los movimientos que ya registraste con fecha de este mes.' : esActual && proy && dia<dias.length ? 'La línea punteada incluye los movimientos que registraste con fecha futura.' : '';
  return seccion('bq-saldo', BLOQUES_NOMBRE.saldoMes, fmtCOP(ahora),
    `<div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:6px;"><span class="big-num" style="font-size:22px;">${fmtCOP(ahora)}</span>${chip}</div>
     ${lineasSVG(series, dias.length, {area:1, desdeCero:false, punto:[dia, ahora], aria:'Saldo total de tus cuentas por día'})}
     <div class="sub-label" style="margin:8px 0 0; line-height:1.5;">Empezaste el mes con ${fmtCOP(inicio)} en tus cuentas (sin tarjetas de crédito).${nota?' '+nota:''}</div>`, true);
}
function renderCupo(){
  const tj = STATE.accounts.filter(a=>esTarjeta(a) && a.cupo>0); if(!tj.length) return '';
  const deuda = fixNum(tj.reduce((t,a)=>t+Math.max(0,-(a.balance||0)),0)), cupo = fixNum(tj.reduce((t,a)=>t+a.cupo,0)), real = cupo>0 ? deuda/cupo : 0, uso = Math.min(1, real);

  const filas = tj.length>1 ? tj.map(a=>{ const d = Math.max(0,-(a.balance||0)); return `<div class="cupo-fila"><span>${esc(a.name)}</span><span>${fmtCOP(d)} de ${fmtCompact(a.cupo).replace(/^COP\s*/,'$')} · ${Math.round(d/a.cupo*100)}%</span></div>`; }).join('') : '';
  return seccion('bq-cupo', BLOQUES_NOMBRE.cupo, Math.round(real*100)+' %',
    `<div class="cupo-box">${dona}<div><div class="sub-label" style="margin:0;">Debes</div><div class="big-num" style="font-size:20px;">${fmtCOP(deuda)}</div><div class="sub-label" style="margin:6px 0 0;">Cupo total</div><div style="font-weight:700;">${fmtCOP(cupo)}</div></div></div>${filas}
     <div class="sub-label" style="margin:10px 0 0; line-height:1.5;">${real>1 ? 'Lo que registraste pasa el cupo: revisa el cupo de la tarjeta o si falta registrar un pago. ' : ''}Usar una parte pequeña del cupo (por ejemplo, menos del 30 %) suele favorecer tu historial crediticio.</div>`, true);
}
// Colchón: cuántos meses de gasto cubre lo que tienes hoy (sin contar lo que debes en tarjetas)
function calcColchon(){
  const hoyK = today().slice(0,7), meses = [];
  for(let i=1; i<=6 && meses.length<3; i++){ const k = monthShift(hoyK,-i); if(monthHasData(k)) meses.push(k); }
  if(!meses.length) return null;
  const prom = fixNum(meses.reduce((t,k)=>t+totalExpenses(k),0)/meses.length); if(!(prom>0)) return null;

// pago: de tu cuenta a una tarjeta (baja la deuda) · avance: del cupo de una tarjeta a tu cuenta (entra plata y sube la deuda)
// mover: entre tus cuentas (solo cambia dónde está la plata)
function tipoTransfer(t){
  const f = accById(t.fromId), d = accById(t.toId), fT = !!(f && esTarjeta(f)), dT = !!(d && esTarjeta(d));
  return !fT && dT ? 'pago' : fT && !dT ? 'avance' : 'mover';
}
const TIPO_TR = {
  pago:   {titulo:'Pago de tarjeta',   ico:'card', corta:(f,d)=>`Paga tu deuda en ${d} y confirma tus compras como gasto`, explica:(f,d)=>`Sale de ${f} y paga tu deuda en ${d}. Las compras pendientes que cubre se confirman como gasto, cada una en su categoría.`},
  avance: {titulo:'Avance de tarjeta', ico:'card', corta:(f,d)=>`Entra plata a ${d} y sube tu deuda en ${f}`, explica:(f,d)=>`Del cupo de ${f} a ${d}: entra plata a tu cuenta (cuenta como ingreso del mes) y sube tu deuda en ${f}.`},
  mover:  {titulo:'Entre tus cuentas', ico:'swap', corta:()=>'Solo cambia dónde está tu plata', explica:(f,d)=>`De ${f} a ${d}: solo cambia dónde está tu plata; tu total no cambia.`},
};
function explicaTransfer(fromId, toId){
  if(!fromId || !toId || fromId===toId) return 'Elige dos cuentas diferentes.';
  return TIPO_TR[tipoTransfer({fromId, toId})].explica(accName(fromId), accName(toId));
}
function transfersOfMonth(key){ return STATE.transfers.filter(t=>t.date.slice(0,7)===key); }
const sumaTr = (key, tipo) => fixNum(transfersOfMonth(key).filter(t=>t.date<=today() && tipoTransfer(t)===tipo).reduce((s,t)=>s+t.amount,0));
const avancesMes = key => sumaTr(key, 'avance'), pagosTarjetaMes = key => sumaTr(key, 'pago'), moverMes = key => sumaTr(key, 'mover');
// Lo que entró a tus cuentas en el mes: ingresos + avances de tarjetas (el avance es plata disponible aunque sea deuda)
const ingresosYAvances = key => fixNum(receivedIncome(key) + avancesMes(key));
// Cómo se movió la plata de tus cuentas (sin tarjetas) en el mes, para cuadrar el saldo paso a paso
function flujoLiquido(key){
  const fin = key===today().slice(0,7) ? today() : lastDayOf(key), ini = key+'-01', en = d => d>=ini && d<=fin;
  const liq = new Set(STATE.accounts.filter(a=>!esTarjeta(a)).map(a=>a.id)), tj = new Set(STATE.accounts.filter(esTarjeta).map(a=>a.id));
  const r = {ingresos:0, otrasEntradas:0, avances:0, gastosCuenta:0, otrasSalidas:0, gastosTarjeta:0, pagos:0, ajustes:0};
  STATE.incomes.forEach(i=>{ if(en(i.date) && liq.has(i.accountId)) r[i.noIngreso ? 'otrasEntradas' : 'ingresos'] += i.amount; });
  STATE.expenses.forEach(e=>{ if(!en(e.date)) return; if(liq.has(e.accountId)) r[e.noGasto ? 'otrasSalidas' : 'gastosCuenta'] += e.amount; else if(tj.has(e.accountId) && !e.noGasto) r.gastosTarjeta += e.amount; });
  STATE.adjustments.forEach(j=>{ if(en(j.date) && liq.has(j.accountId)) r.ajustes += j.amount; });
  STATE.transfers.forEach(t=>{ if(!en(t.date)) return; const tp = tipoTransfer(t); if(tp==='avance') r.avances += t.amount; else if(tp==='pago') r.pagos += t.amount; });
  Object.keys(r).forEach(k=>{ r[k] = fixNum(r[k]); });
  return r;
}
function filaFlujo(lbl, v, color, fuerte){ return `<div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:6px;${fuerte?' font-weight:600; border-top:1px solid var(--border); padding-top:6px;':''}"><span style="color:${fuerte?'var(--text)':'var(--text-dim)'}">${lbl}</span><span style="${color?'color:'+color:''}">${v}</span></div>`; }
function panelFlujo(key, saldoInicial, saldoFinal, esActual){
  const f = flujoLiquido(key), disp = fixNum(saldoInicial + f.ingresos + f.avances + f.otrasEntradas - f.otrasSalidas);
  const resto = fixNum(saldoFinal - (disp - f.gastosCuenta - f.pagos + f.ajustes));
  const m = n => fmtCOP(Math.abs(n));
  return `<div style="font-size:13px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">
    ${filaFlujo('Tenías (saldo inicial)', fmtCOP(saldoInicial))}
    ${filaFlujo('+ Te ingresó', '+'+m(f.ingresos), 'var(--positive)')}
    ${f.avances ? filaFlujo('+ Avances de tus tarjetas', '+'+m(f.avances), 'var(--positive)') : ''}
    ${f.otrasEntradas ? filaFlujo('+ Entradas que no son ingreso (préstamos, devoluciones)', '+'+m(f.otrasEntradas), 'var(--positive)') : ''}
    ${f.otrasSalidas ? filaFlujo('− Salidas que no son gasto (deudas viejas, ahorro)', '−'+m(f.otrasSalidas), 'var(--danger)') : ''}
    ${filaFlujo('Total disponible', fmtCOP(disp), '', true)}
    ${filaFlujo('− Gastos pagados desde tus cuentas', '−'+m(f.gastosCuenta), 'var(--danger)')}
    ${f.pagos ? filaFlujo('− Pagos a tus tarjetas', '−'+m(f.pagos), 'var(--danger)') : ''}
    ${f.ajustes ? filaFlujo('± Ajustes de saldo', (f.ajustes<0?'−':'+')+m(f.ajustes)) : ''}
    ${Math.abs(resto)>=1 ? filaFlujo('± Otros movimientos', (resto<0?'−':'+')+m(resto)) : ''}
    ${filaFlujo(esActual ? 'Saldo de hoy' : 'Saldo al cierre', fmtCOP(saldoFinal), '', true)}
    ${f.gastosTarjeta ? `<div class="sub-label" style="margin:6px 0 0; line-height:1.45;">Este mes compraste ${fmtCOP(f.gastosTarjeta)} con tarjetas de crédito: cada compra cuenta como gasto cuando la pagas.</div>` : ''}
  </div>`;
}
// Ajustes de saldo: también se pueden revisar, corregir o borrar
function openAjusteModal(id){
  const j = STATE.adjustments.find(x=>x.id===id); if(!j) return;
  openModal(`<div class="modal-head"><h3>Ajuste de saldo</h3><button class="close-x" onclick="closeModal()" aria-label="Cerrar">${ic('x',22)}</button></div>
    <div class="sub-label" style="margin:0 0 10px; line-height:1.5;">Corrección al saldo de <b>${esc(accName(j.accountId))}</b> para que cuadrara con el banco. No es ingreso ni gasto: solo corrige el saldo.</div>
    <label for="ajSigno">El ajuste</label><select id="ajSigno"><option value="1" ${j.amount>0?'selected':''}>Sumó al saldo</option><option value="-1" ${j.amount<0?'selected':''}>Restó al saldo</option></select>
    <label for="ajMonto">Valor (COP)</label><input type="text" id="ajMonto" class="money-input" value="${formatMoneyInputValue(Math.abs(j.amount))}">
    <label for="ajFecha">Fecha</label><input type="date" id="ajFecha" value="${j.date}" max="${today()}">
    <div style="margin-top:18px"><button class="btn btn-primary btn-block" id="ajGuardar">Guardar cambios</button></div>
    <button class="btn-danger-link" id="ajBorrar" type="button">Eliminar ajuste</button>`, {center:true});
  document.getElementById('ajGuardar').onclick = ()=>{
    const v = parseMoneyInput(document.getElementById('ajMonto')), f = document.getElementById('ajFecha').value || j.date;
    if(!(v>0)){ alert('Escribe un valor mayor que cero.'); return; }
    if(!DATE_RE.test(f) || f>today()){ alert('La fecha no puede ser futura.'); return; }
    j.amount = fixNum(v * parseInt(document.getElementById('ajSigno').value,10)); j.date = f;
    saveState(); closeModal(); render(); toast('Ajuste actualizado');
  };
  document.getElementById('ajBorrar').onclick = ()=>{
    const i = STATE.adjustments.indexOf(j); STATE.adjustments.splice(i,1); saveState(); closeModal(); render();
    toast('Ajuste eliminado', {label:'Deshacer', fn:()=>{ STATE.adjustments.push(j); saveState(); render(); }});
  };
}
function filaTransfer(t){
  const tp = tipoTransfer(t), T = TIPO_TR[tp], hora = t.timestamp ? ' · '+new Date(t.timestamp).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '';
  let corta = T.corta(accName(t.fromId), accName(t.toId));
  if(tp==='pago'){   // qué compras confirmó este pago
    const cb = confirmadoPorPago(t), compras = cb.filter(c=>c.e), otra = fixNum(cb.filter(c=>!c.e).reduce((s,c)=>s+c.monto,0));
    const nom = e => e.desc || ((findSub(e.catId,e.subId)||{}).name) || 'compra';
    corta = compras.length ? 'Confirma como gasto: ' + compras.slice(0,3).map(c=>`${nom(c.e)} ${fmtCOP(c.monto)}`).join(' · ') + (compras.length>3 ? ` y ${compras.length-3} más` : '') + (otra ? ` · ${fmtCOP(otra)} de deuda sin compra registrada (no es gasto)` : '')
      : otra ? `Paga ${fmtCOP(otra)} de deuda sin compras registradas (avances o deuda anterior): no es gasto` : 'No había compras pendientes: queda como saldo a favor en la tarjeta';
  }
  const monto = tp==='pago' ? `<div class="amount neg">−${fmtCOP(t.amount)}</div>` : tp==='avance' ? `<div class="amount pos">+${fmtCOP(t.amount)}</div>` : `<div class="amount" style="color:var(--text-dim)">${fmtCOP(t.amount)}</div>`;
  return `<div class="list-item mov-tr" data-action="edit-transfer" data-id="${esc(t.id)}" style="cursor:pointer;">
    <div class="ic-bubble" style="background:color-mix(in srgb, var(--text-faint) 18%, transparent);">${ic(T.ico,20)}</div>
    <div class="info"><div class="title">${esc(t.desc || T.titulo)}${t.desc ? ` <span class="tr-tag">${T.titulo}</span>` : ''}</div>
      <div class="meta">${esc(accName(t.fromId))} → ${esc(accName(t.toId))}${hora}</div>
      <div class="meta tr-exp">${esc(corta)}</div></div>
    ${monto}</div>`;
}
function filaAjuste(j){
  return `<div class="list-item mov-tr" data-action="edit-ajuste" data-id="${esc(j.id)}" style="cursor:pointer;">
    <div class="ic-bubble" style="background:color-mix(in srgb, var(--text-faint) 18%, transparent);">${ic('scale',20)}</div>
    <div class="info"><div class="title">Ajuste de saldo</div><div class="meta">${esc(accName(j.accountId))}</div><div class="meta tr-exp">Corrige el saldo · no es ingreso ni gasto</div></div>
    <div class="amount" style="color:var(--text-dim)">${j.amount<0?'−':'+'}${fmtCOP(Math.abs(j.amount))}</div></div>`;
}
function viewMovimientos(){

    list = list.filter(e => { const c = findCat(e.catId), sub = findSub(e.catId, e.subId); return cumple([e.desc, sub&&sub.name, c&&c.name, String(e.amount), formatMoneyInputValue(e.amount)].join(' ')); });
    trs = trs.filter(t => cumple([t.desc, TIPO_TR[tipoTransfer(t)].titulo, 'transferencia', accName(t.fromId), accName(t.toId), String(t.amount), formatMoneyInputValue(t.amount)].join(' ')));
    ajs = ajs.filter(j => cumple(['ajuste de saldo', accName(j.accountId), String(Math.abs(j.amount)), formatMoneyInputValue(Math.abs(j.amount))].join(' ')));
  }
  const items = list.map(e=>({k:'e', d:e.date, ts:e.timestamp||0, o:e})).concat(trs.map(t=>({k:'t', d:t.date, ts:t.timestamp||0, o:t})), ajs.map(j=>({k:'j', d:j.date, ts:j.timestamp||0, o:j})));

  const pendMes = fixNum(expensesOfMonth(key).filter(e=>isRealized(e) && esTarjeta(accById(e.accountId))).reduce((t,e)=>{ const s = estadoCompra(e); return t + (s ? s.pend : 0); },0));

  const otras = fixNum(expensesOfMonth(key).filter(e=>e.noGasto && isRealized(e)).reduce((t,e)=>t+e.amount,0));
  const extra = [otras ? `otras salidas ${fmtCOP(otras)}` : '', avances ? `avances ${fmtCOP(avances)}` : '', mover ? `entre tus cuentas ${fmtCOP(mover)}` : ''].filter(Boolean);
  const categoriesOptions = STATE.categories.map(c => `<option value="${esc(c.id)}" ${movFilterCat===c.id?'selected':''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('');
  const porDia = {}; items.forEach(it=>{ (porDia[it.d] = porDia[it.d] || []).push(it); });

const esTarjeta = a => !!a && a.type==='tarjeta';

const mDeEA = ea => Math.pow(1+ea, 1/12) - 1;
const eaDeM = m => Math.pow(1+m, 12) - 1;
const pctTxt = (x,dec=2) => (x*100).toLocaleString('es-CO',{minimumFractionDigits:dec, maximumFractionDigits:dec})+'%';
